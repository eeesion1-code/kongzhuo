<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>广告预约部</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="广告预约部">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<style>
/* 11/19 用户：「APP 上的我的店改为广告部门（后定名「广告预约部」），按键排在运营部前面。里面要生成的任务为 Slack 经营群的数据：每一天预约的客人无断取消，
   统计每一家店铺无断取消的数据，金额也要，然后每个月的数据。再加上预约中心是否有把这组客人取消掉，并签字署名是否料金跟客人打通电话收回回来钱了。
   那钱有没有回来要在会计部显示，会计部根据这个信息来跟进客人是否汇款」。
   数据：Slack #经营汇报 → Claude 每天 10:00 读 → 后台「无断取消」工作表（what=ns 读・nsdo 写）。和空桌一览同一个网站、同一个密码・手机编号。 */
:root{--bg:#f5f6f8;--card:#fff;--ink:#16181d;--sub:#6b7280;--faint:#9ca3af;--line:#e6e8ec;--soft:#f0f2f5;--brand:#1d4ed8;
  --good:#15803d;--goodBg:#ecfdf3;--warn:#b45309;--warnBg:#fef3c7;--bad:#dc2626;--badBg:#fee2e2;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08)}
@media (prefers-color-scheme: dark){:root{--bg:#0f1115;--card:#181b21;--ink:#eceef2;--sub:#a1a7b3;--faint:#6b7280;--line:#2a2f38;--soft:#20242c;--brand:#3b82f6;
  --good:#22c55e;--goodBg:#11281a;--warn:#facc15;--warnBg:#2f2a10;--bad:#f87171;--badBg:#361515;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
html{touch-action:manipulation}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:active,a:active{opacity:.6}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:8px;max-width:760px;margin:0 auto}
.top a.back{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:14px;color:var(--ink);text-decoration:none}
.top h1{flex:1;margin:0;font-size:19px}.top small{font-size:12px;color:var(--sub)}
main{max-width:760px;margin:0 auto;padding:10px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;margin:10px 0}
.ct{font-weight:700;font-size:16px;margin-bottom:4px}
.note{font-size:12.5px;color:var(--sub);line-height:1.6;margin:4px 0 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.chips button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chips button.f1,.tjt tr.f1 td{background:rgba(234,88,12,.22)}.chips button.f2,.tjt tr.f2 td{background:rgba(220,38,38,.28)}.chips button.on.f1,.chips button.on.f2{color:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.kp div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.kp small{display:block;font-size:12.5px;color:var(--sub)}.kp b{font-size:24px;line-height:1.25}.kp .g b{color:var(--good)}.kp .r b{color:var(--bad)}
.kp .w{grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 4px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--sub);font-weight:600;border-top:0}td:first-child,th:first-child{text-align:left;white-space:normal}
.case{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;margin:10px 0}
.case.todo{border-left:4px solid var(--bad)}.case.urg{background:var(--badBg);border:2px solid var(--bad)}.urgent{background:var(--badBg);border:2px solid var(--bad);border-radius:12px;padding:10px 12px;margin:10px 0}.urgent .ut{color:var(--bad);font-weight:800;font-size:16px}.urgent .ur{border-top:1px dashed var(--bad);padding:7px 0 2px;margin-top:6px;font-size:13.5px}.urgent .ur a{color:var(--bad);font-weight:700;text-decoration:underline;cursor:pointer}.case.wait{border-left:4px solid var(--warn)}.case.done{border-left:4px solid var(--good);opacity:.85}
.case .h{font-weight:700;font-size:15.5px}.case .m{font-size:13px;color:var(--sub);margin-top:2px}.case .amt{font-weight:700}
.step{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;font-size:14px}
.step .t{font-weight:700;font-size:13.5px;color:var(--sub)}
.ok{color:var(--good);font-weight:600}.wt{color:var(--warn);font-weight:600}.no{color:var(--bad);font-weight:600}
.undo{font-size:12.5px;color:var(--sub);text-decoration:underline;margin-left:6px;cursor:pointer}
.row2{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.row2 input{flex:1 1 120px;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:16px}
.go{border:0;border-radius:10px;background:var(--brand);color:#fff;font-weight:700;padding:9px 14px}
.res{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.res label{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:14px;background:var(--card)}
.res input{display:none}.res input:checked+span{color:#fff}.res label:has(input:checked){background:var(--brand);border-color:var(--brand);color:#fff}
.me{display:flex;align-items:center;gap:8px;background:var(--warnBg);border-radius:12px;padding:8px 10px;margin:8px 0;font-size:14px}
.me input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:16px}
.yks.f1{background:rgba(234,88,12,.14)}.yks.f2{background:rgba(220,38,38,.16)}
.ykcm{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.ykcm button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;width:40px;height:34px;font-size:18px}.ykcm button:disabled{opacity:.3}
.ykg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.ykg i{font-style:normal;text-align:center;font-size:12px;color:var(--sub)}.ykg i.rd{color:var(--bad)}.ykg i.bl{color:var(--brand)}
.ykg button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:3px 0;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;font:inherit;cursor:pointer}
.ykg button b{font-size:13px}.ykg button small{font-size:9.5px;color:var(--sub);line-height:1.15}
.ykg button.f1{background:rgba(234,88,12,.25)}.ykg button.f2{background:rgba(220,38,38,.32)}.ykg button.td{border-color:var(--brand);border-width:2px}
.ykg button.in{box-shadow:inset 0 0 0 2px var(--brand)}.ykg button.end{box-shadow:inset 0 0 0 3px var(--ink)}
.ykl1,.ykl2{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px}.ykl1{background:rgba(234,88,12,.5)}.ykl2{background:rgba(220,38,38,.6)}
.ykc{cursor:pointer}.ykh{display:flex;gap:8px;align-items:flex-start}.ykn{flex:1;min-width:0}.yka{display:inline-block;background:var(--soft);border-radius:8px;padding:1px 8px;font-size:12.5px;font-weight:700}
.ykt{font-size:16px;font-weight:800;margin:4px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ykno{display:inline-block;background:var(--ink);color:var(--bg);border-radius:8px;padding:0 6px;font-size:12px;font-weight:800;margin-right:6px}
.ykp{color:var(--good);font-size:14px;font-weight:700}.ykp b{font-size:19px}.ykp.lo{color:var(--bad)}.ykmx{color:var(--sub);font-weight:500;font-size:12.5px}
.ykr{text-align:center;min-width:58px}.ykr b{font-size:30px;display:block;line-height:1.1}.ykr small{font-size:12px;color:var(--sub)}
.ykbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.ykb{font-size:12.5px;border-radius:999px;padding:2px 9px;font-weight:600}.ykb.r{background:var(--badBg);color:var(--bad)}.ykb.o{background:rgba(234,88,12,.18);color:#ea580c}.ykb.y{background:var(--warnBg);color:var(--warn)}
.msg{font-size:13.5px;margin:6px 0}.msg.e{color:var(--bad)}.msg.s{color:var(--good)}
.sec{font-size:13.5px;color:var(--sub);font-weight:700;margin:16px 2px 4px}
.empty{padding:28px 10px;text-align:center;color:var(--sub)}
.keybox{text-align:center;padding:40px 8px}.keybox input{display:block;width:100%;max-width:260px;margin:12px auto 0;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:16px;text-align:center}.keybox button{display:block;width:100%;max-width:260px;margin:10px auto 0;padding:12px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;font-size:16px}
.foot{font-size:12px;color:var(--faint);text-align:center;margin:20px 0 0}.foot a{color:var(--sub);text-decoration:underline;cursor:pointer}
.det{background:var(--soft);border-radius:10px;padding:8px 10px;margin:6px 0 2px}.det table{width:100%;border-collapse:collapse;font-size:13.5px}.det th,.det td{text-align:left;padding:4px 4px;border-top:1px solid var(--line);vertical-align:top;white-space:normal}.det tr:first-child th,.det tr:first-child td{border-top:0}.det th{width:7.5em;color:var(--sub);font-weight:600;white-space:nowrap}.det td{word-break:break-all}
details summary{cursor:pointer;color:var(--sub);font-size:14px;margin:12px 2px}
/* 11/20 「📋 每日上报」 */
.chips .bd{display:inline-block;min-width:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;line-height:1.5}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;margin:8px 0}.cg{border-radius:10px;padding:6px 8px;font-size:12.5px;line-height:1.4;border:1px solid var(--line);background:var(--card)}.cg.ok{border-color:var(--good);background:var(--goodBg)}.cg.miss{border-color:var(--bad);background:var(--badBg)}.cg.bad{border-color:var(--warn);background:var(--warnBg)}.cg small{color:var(--sub)}
.kp .g b{color:var(--good)}
/* 11/19 「🔍 网页检查」 */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 6px}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 6px;font-weight:700;font-size:15px;box-shadow:var(--shadow)}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.testbar{position:sticky;top:0;z-index:70;background:#fde047;color:#422006;font-size:13.5px;font-weight:700;padding:calc(7px + env(safe-area-inset-top)) 12px 7px;text-align:center}.testbar a{color:#1d4ed8}
.xqta{width:100%;min-height:96px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:16px;font-family:inherit;margin-top:6px;box-sizing:border-box}
.xqr{border-top:1px solid var(--line);padding:9px 0}.xqr:first-of-type{border-top:0}.xqp{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;background:var(--soft);color:var(--sub)}.xqp.b{background:#dbeafe;color:#1d4ed8}.xqp.g{background:var(--goodBg);color:var(--good)}.xqp.w{background:var(--warnBg);color:var(--warn)}
.xbtn{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.xbtn button,.xbtn a{border:0;border-radius:10px;padding:11px 6px;font-weight:700;font-size:15px;color:#fff;text-align:center;text-decoration:none}
.tabs button .bd{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;line-height:20px}
.wcs .wi{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
.wcs .wf{font-weight:700;font-size:14.5px}.wcs .wf small{font-weight:400;color:var(--faint);margin-left:6px}
.rv{display:grid;gap:4px;font-size:14.5px;margin-top:6px}.rv b{font-size:18px}.rv .g b{color:var(--good)}.rv .r b{color:var(--bad)}
.wcs .fx{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px;font-size:13.5px}.wcs .fx span{display:block;color:var(--sub);font-size:12.5px}
.wt2{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:4px}.wt2 td{border-top:1px solid var(--line);padding:5px 4px;text-align:left;white-space:normal;vertical-align:top}
.wt2 td:first-child{width:6.8em;color:var(--sub);white-space:nowrap}.wt2 tr:first-child td{border-top:0}
.wt2 tr.odd td{background:var(--badBg)}.wt2 tr.odd td:last-child b{color:var(--bad)}
.wt2 .raw{display:block;font-size:12px;color:var(--faint);word-break:break-all}
.lk{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.lk a{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--brand);text-decoration:none;background:var(--card)}
.wstat{font-size:14px;margin:6px 0}
.tabs button:last-child:nth-child(odd){grid-column:1/-1}
/* 11/25 「💴 T榜价格」 */
.tjb{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:700;background:var(--soft);color:var(--sub)}
.tjb.up{background:var(--goodBg);color:var(--good)}.tjb.hi{background:var(--badBg);color:var(--bad)}.tjb.mid{background:var(--warnBg);color:var(--warn)}
.tjs{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}.tjs .h{font-weight:700;font-size:15px}
.tjbar{position:relative;height:22px;background:var(--soft);border-radius:6px;margin:8px 0 2px}
.tjbar .q{position:absolute;top:0;bottom:0;background:#bfdbfe;border-radius:6px}.tjbar .m{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--brand)}
.tjbar .tjme{position:absolute;top:2px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--warn);border:2px solid var(--card);padding:0}
.tjbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint)}
.tjt td,.tjt th{font-size:13px;padding:6px 3px}.tjt tr.tjme td{background:var(--warnBg)}.tjt tr{cursor:pointer}
.tjc{font-size:12.5px;color:var(--sub);background:var(--soft);border-radius:8px;padding:6px 8px;margin:4px 0;white-space:normal;text-align:left}
</style>
</head>
<body>
<header><div class="top"><a class="back" id="back" href="./" style="display:none">‹ 空桌一览</a><h1>📣 广告预约部</h1><small id="at"></small></div></header>
<main id="main"><div class="empty">读取中…</div></main>
<script>
const API = 'https://script.google.com/macros/s/AKfycbxDX1OB8iAKYYpfBlncpfov66qsDdWfq6wjs2xNGydXDbkkUPf7NsOwwmd_PG2Dbpe0/exec';
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const jq = s => esc(JSON.stringify(String(s == null ? '' : s)));   // 11/24 安全：数据放进按钮点击代码一律用 ${jq(x)}，不要写 '${x}'（esc 防不了代码里的引号）
const yen = n => '¥' + (Number(n) || 0).toLocaleString('ja-JP');
// 11/19 用户：「广告部的 APP 只能让广告部和预约中心看的链接发一个…只能最开始的 2 台手机看，和 2 台电脑」
//   单独打开（https://eeesion1-code.github.io/kongzhuo/gg.html）时用「广告预约部密码」（后台角色 gg，名额：广告预约部手机 2・电脑 2，先登录先占）；
//   这个密码另存在 ggk，不动空桌一览的密码 k。从空桌一览底栏点进来时没有 ggk，就用空桌一览的密码（老板・店长）。
let K = LS.get('ggk', '') || LS.get('k', '');
const DV = (() => { let v = LS.get('dv', ''); if (!/^[0-9a-f]{32}$/.test(v)) { const a = new Uint8Array(16); crypto.getRandomValues(a); v = Array.from(a, b => b.toString(16).padStart(2, '0')).join(''); LS.set('dv', v); } return v; })();
function showKey(msg) {
  $('main').innerHTML = `<div class="keybox"><p>📣 广告预约部<br>请输入负责人给的密码</p><input id="kin" autocomplete="off" autocapitalize="off" enterkeyhint="go" onkeydown="if(event.key==='Enter')saveKey()"><button onclick="saveKey()">开始使用</button><p class="msg e">${esc(msg || '')}</p></div>`;
  $('at').textContent = '';
}
function saveKey() { const v = (($('kin') || {}).value || '').trim(); if (!v) return; LS.set('ggk', v); K = v; NS = null; load(); }
function changeKey() { try { localStorage.removeItem('ggk'); localStorage.removeItem('ggc'); } catch (e) {} K = LS.get('k', ''); NS = null; showKey(''); }
const DVUA = (() => { const u = navigator.userAgent, st = (navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)) ? '主屏幕APP' : '浏览器'; let m;
  if ((m = u.match(/iPhone OS ([\d_]+)/))) return `iPhone iOS ${m[1].replace(/_/g, '.')}・${st}`;
  if ((m = u.match(/iPad.*? OS ([\d_]+)/))) return `iPad iOS ${m[1].replace(/_/g, '.')}・${st}`;
  if ((m = u.match(/Android ([\d.]+); ([^;)]+)/))) return `Android ${m[1]} ${m[2].trim()}・${st}`;
  return `${(u.match(/Windows NT|Macintosh|Android|Linux/) || ['其他'])[0]}・${st}`; })();
const PV = () => K === LS.get('k', '') ? (['staff', 'gg'].includes(LS.get('asRole', '')) ? LS.get('asRole', '') : LS.get('asStaff', '') === '1' ? 'staff' : '') : '';
function exitPreview() { ['asRole', 'asStaff', 'last', 'acrq'].forEach(k => { try { localStorage.removeItem(k); } catch (e) {} }); location.href = './'; }   // 11/19 老板在空桌一览「📱 登录手机」点了「👀 看店长画面」→ 这页也按店长权限看
const api = q => fetch(API + '?fmt=json' + q + '&k=' + encodeURIComponent(K) + '&dv=' + DV + '&ua=' + encodeURIComponent(DVUA) + (PV() ? '&as=' + PV() : ''), { cache: 'no-store' }).then(r => r.json());

let NS = (() => { try { return JSON.parse(LS.get('ggc', 'null')); } catch (e) { return null; } })(), err = '', busy = false, msgs = {}, month = LS.get('ggMonth', ''), offOpen = '';
const RES = ['同意付款', '已当场付', '请求中', '客人回复不付款', '拒绝', '联系不上', '不收'];   // 11/19 用户加「请求中」「客人回复不付款」
const ASKED = r => PAY.includes(r) || r === '请求中';   // 已经向客人请求了金额的
const PAY = ['同意付款', '已当场付'];
// 11/25 用户：「会计查到未付款成功点了后写了理由，它会重新跳到广告部门那边吗？让广告部门对接取消料金」
//   会计部按「没回款」（到账・金额＝0）后，预约中心还没重新联系（联系・时间 ≤ 到账・时间）→ 退回「预约中心要处理」；
//   预约中心重新打电话签 ② → 结果是 同意付款／已当场付 就回到会计部「等客人汇款」（会计再按回款成功／没回款，覆盖上次），其他结果＝结束。

  //   → 按店下面、签名名字上面放红底「🚨 紧急」块（所有月份），点「去处理」跳到下面那单的卡片（卡片也是红底、排在要处理最前）
  const urg = todo.filter(BACK);
  if (urg.length) h += `<div class="urgent"><div class="ut">🚨 紧急处理：客人答应付取消料，会计查无入金（${urg.length} 组）</div>`
    + '<div class="note" style="color:var(--ink)">会计部查了存折没看到这笔钱，退回预约中心，<b>请先处理这几单</b>：联系客人——说已经付了，问清付款日期・汇款名义写在说明里，选「同意付款」让会计再查；还没付就催款，客人不付了选「客人回复不付款」。</div>'
    + urg.map(o => `<div class="ur"><b>${esc(o['预约日'].slice(5).replace('-', '/'))} ${esc(o['公司'])} ${esc(o['店'])}　${esc(o['客人'])} 様　${yen(o['请求额'])}</b>`
      + `<br>会计 ${esc(o['到账・谁'])} ${esc(String(o['到账・时间']).slice(5))}：${esc(ngWhy(o))}　<a onclick="var e=document.getElementById(${jq('case_' + o['编号'])});e&&e.scrollIntoView({behavior:'smooth',block:'start'})">去处理 ↓</a></div>`).join('') + '</div>';
  const wait = all.filter(o => stOf(o) === 'wait').sort((a, b) => (b['预约日'] + b['时间']).localeCompare(a['预约日'] + a['时间']));
  h += `<div class="me">✍ 签名用的名字<input id="who" placeholder="例：预约中心 王" maxlength="20" value="${esc(LS.get('ggWho', ''))}"></div>`;
  h += `<div class="sec">🔴 预约中心要处理（${todo.length}${urg.length ? '，其中 🚨 紧急 ' + urg.length : ''}）</div>` + (todo.length ? todo.map(caseCard).join('') : '<div class="note">都处理完了。</div>');
  h += `<div class="sec">🟡 等会计部确认到账（${wait.length}）</div>` + (wait.length ? wait.map(caseCard).join('') : '<div class="note">没有。</div>');
  const done = ms.filter(o => stOf(o) === 'done');
  h += `<details><summary>🟢 ${esc(PL)} 已完成（${done.length}）</summary>${done.map(caseCard).join('') || '<div class="note">没有。</div>'}</details>`;
  if (NS.role === 'gg') h += '<div class="foot"><a onclick="changeKey()">🔑 换密码</a></div>';
  if (NS.owner) h += `<div class="card"><div class="ct">🔐 广告预约部密码（只有股东看得到）</div><div class="note">给广告部・预约中心用的密码。用这个密码只能看这一页；最开始登录的 2 台手机・2 台电脑能用（第 3 台起挡住、发邮件给你）。至少 6 个字，不能和别的密码一样。</div>`
    + `<div class="row2"><input id="gp1" type="password" autocomplete="new-password" placeholder="新密码"><input id="gp2" type="password" autocomplete="new-password" placeholder="再输一次"></div>`
    + `<div class="row2"><button class="go" onclick="setGgKey()">保存</button></div>${msgs.__gg ? `<div class="msg ${msgs.__gg[0]}">${msgs.__gg[1]}</div>` : ''}`
    + `<div class="note">发给广告部・预约中心的链接：<br><b>${esc(location.origin + location.pathname)}</b>　<a class="undo" style="margin:0" onclick="navigator.clipboard && navigator.clipboard.writeText(location.origin + location.pathname).then(() => { msgs.__gg = ['s', '✓ 链接已复制']; render(); })">复制链接</a></div></div>`;
  paint(h);   // 重画时保留已经写的字・选的结果（签名失败提示时不用重写）
}
if (PV()) document.body.insertAdjacentHTML('afterbegin', '<div id="pvbar" style="position:sticky;top:0;z-index:60;background:#facc15;color:#422006;font-size:14px;font-weight:700;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:8px"><span style="flex:1">👀 正在看' + (PV() === 'gg' ? '广告预约部画面（广告部・预约中心看到的样子）' : '店长画面') + '</span><button onclick="exitPreview()" style="border:0;border-radius:999px;background:#422006;color:#fff;padding:6px 12px;font-weight:700">回到股东画面</button></div>');
render();
load();
loadXq();   // 11/20 提需求的待看数显示在标签上
document.addEventListener('visibilitychange', () => { if (!document.hidden) { load(); loadXq(); } });
</script>
</body>
