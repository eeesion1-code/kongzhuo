<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>空桌一览</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="空桌一览">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--ink:#16181d;--sub:#6b7280;--faint:#9ca3af;--line:#e6e8ec;--soft:#f0f2f5;
  --brand:#1d4ed8;--brandInk:#fff;
  --free:#16a34a;--freeBg:#ecfdf3;
  --used:#64748b;--usedBg:#f1f5f9;
  --remind:#b45309;--remindBg:#fef3c7;
  --lo:#c2410c;--loBg:#ffedd5;
  --over:#dc2626;--overBg:#fee2e2;
  --held:#2563eb;--heldBg:#dbeafe;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1115;--card:#181b21;--ink:#eceef2;--sub:#a1a7b3;--faint:#6b7280;--line:#2a2f38;--soft:#20242c;
    --brand:#3b82f6;
    --free:#22c55e;--freeBg:#11281a;--used:#94a3b8;--usedBg:#1f242c;--remind:#facc15;--remindBg:#2f2a10;
    --lo:#fb923c;--loBg:#33210f;--over:#f87171;--overBg:#361515;--held:#60a5fa;--heldBg:#132544;
    --shadow:none;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Hiragino Sans","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.r{color:var(--over)}

/* 顶部 */
header{background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 14px 8px}
.top{display:flex;align-items:center;gap:10px}
h1{font-size:20px;margin:0;flex:1;letter-spacing:.5px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--free)}
.live.warn .dot{background:var(--remind)} .live.bad .dot{background:var(--over)} .live.bad{color:var(--over)}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:17px}
.iconbtn.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#banner{display:none;margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--overBg);color:var(--over);font-size:13px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stats.own{grid-template-columns:repeat(2,1fr)}
@media (min-width:700px){.stats.own{grid-template-columns:1.4fr 1fr 1fr 1fr}}
.stat.sales b{color:var(--brand)}
.yen{color:var(--brand);font-weight:600}
#banner.stop{font-size:14px;font-weight:600;padding:10px 12px;border:1.5px solid var(--over)}
#banner.info{background:var(--soft);color:var(--sub)}
.stat{background:var(--card);border-radius:12px;padding:8px 10px;box-shadow:var(--shadow);border:1px solid var(--line)}
.stat small{display:block;font-size:11px;color:var(--sub)}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.stat b em{font-style:normal;font-size:12px;color:var(--sub);font-weight:400}

.tools{display:flex;gap:8px;margin-top:10px}
#q{flex:1;min-width:0;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.sortbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 12px;font-size:13px;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* 店铺卡片 */
main{padding:4px 14px 20px;max-width:1400px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:10px;align-items:start}
.grid .card{margin-bottom:0}
.stn{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--soft);color:var(--ink);font-weight:600;font-size:12px}
.sec{font-size:12px;color:var(--sub);margin:14px 4px 6px;letter-spacing:.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.hd{display:flex;gap:10px;padding:12px 12px 10px;align-items:flex-start}
.star{border:0;background:none;font-size:20px;line-height:1;padding:2px 0 0;color:var(--faint)}
.star.on{color:#f59e0b}
.nm{flex:1;min-width:0}
.area{font-size:12px;color:var(--sub)}
.sn{font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{text-align:right;white-space:nowrap;line-height:1.1}
.big b{font-size:28px;font-variant-numeric:tabular-nums}
.big small{display:block;font-size:12px;color:var(--sub)}
.g{color:var(--free)} .m{color:var(--remind)} .rr{color:var(--over)}
.seg{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--usedBg);margin-top:8px}
.seg i{height:100%}
.best{margin:0 12px 10px;padding:8px 10px;border-radius:10px;background:var(--soft);font-size:13px}
.best b{font-weight:600}
.mini{display:flex;flex-wrap:wrap;gap:3px;margin:0 12px 10px;cursor:pointer}
.mini i{font-style:normal;min-width:26px;height:20px;padding:0 3px;border-radius:5px;font-size:10px;line-height:20px;text-align:center;background:var(--usedBg);color:var(--used);box-sizing:border-box}
.mini i.free{background:var(--free);color:#fff}
.mini i.held{background:var(--held);color:#fff}
.mini i.remind{background:var(--remindBg);color:var(--remind);box-shadow:inset 0 0 0 1.5px var(--remind)}
.mini i.lo{background:var(--loBg);color:var(--lo);box-shadow:inset 0 0 0 1.5px var(--lo)}
.mini i.over{background:var(--over);color:#fff}
.mini i.cl{outline:2px solid var(--over);outline-offset:1px}
/* 预约 */
.best.sn{margin-top:-6px;background:var(--heldBg);color:var(--held)}
.tile .nx{font-size:11px;margin-top:3px;color:var(--held);line-height:1.35}
.tile .nx.cl{color:var(--over);font-weight:600}
.tile.clash{border:2px solid var(--over)}
h3 small{font-weight:400;color:var(--sub);font-size:12px}
.ldg{display:grid;gap:4px;margin-top:6px}
.ldg>div{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:7px 10px;border-radius:8px;background:var(--soft);font-size:13px;line-height:1.35}
.ldg>div.gone{opacity:.5}
.ldg .lt{font-variant-numeric:tabular-nums;font-weight:600}
.ldg small{color:var(--sub);font-size:11.5px}
.ldg .ln{min-width:0;overflow-wrap:anywhere}
.rc{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--usedBg);color:var(--used);white-space:nowrap}
.rc.in{background:var(--freeBg);color:var(--free)}
.rc.gone{background:transparent}
.rc.late1{background:var(--remindBg);color:var(--remind)}
.rc.late2{background:var(--overBg);color:var(--over)}
.best.wn{margin-top:-6px;background:#fef3c7;color:#92400e}
.body>.best.wn{margin:8px 0}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.bd{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--sub)}
.bd.held{background:var(--heldBg);color:var(--held)} .bd.remind{background:var(--remindBg);color:var(--remind)}
.bd.lo{background:var(--loBg);color:var(--lo)} .bd.over{background:var(--overBg);color:var(--over)}
.closed .sn,.closed .big{opacity:.5}
.more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:9px;font-size:13px;color:var(--brand)}

/* 展开后 */
.body{padding:0 12px 12px}
.filters{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;margin-top:8px;align-items:start}
.tile{position:relative;border-radius:10px;padding:6px 7px 7px;min-height:58px;font-size:11.5px;line-height:1.3;overflow:hidden;background:var(--usedBg);border:1px solid transparent}
.tile b{display:block;font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:.2px}
.tile .st{font-weight:600}
.tile .x{color:var(--sub);margin-top:2px;word-break:break-all}
.tile .tm{position:absolute;left:0;bottom:0;height:3px;background:currentColor;opacity:.5}
.tile.free{background:var(--freeBg);border:1.5px dashed var(--free);min-height:44px}
.tile.free .st{color:var(--free)}
.tile.used .st{color:var(--used)}
.tile.remind{background:var(--remindBg)} .tile.remind .st{color:var(--remind)}
.tile.lo{background:var(--loBg)} .tile.lo .st{color:var(--lo)}
.tile.over{background:var(--overBg)} .tile.over .st{color:var(--over)}
.tile.held{background:var(--heldBg)} .tile.held .st{color:var(--held)}
.tile.dim{opacity:.18}
.tile.open{grid-column:1/-1}
h3{font-size:13px;margin:14px 2px 6px;color:var(--sub);font-weight:600}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:12px}
.tl div{position:relative;padding:4px 0;font-size:13px}
.tl div::before{content:"";position:absolute;left:-17px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--faint)}
.tl div.now::before{background:var(--free)}
.tl b{display:inline-block;min-width:52px;font-variant-numeric:tabular-nums}
.note{font-size:12.5px;padding:8px 10px;border-radius:10px;background:var(--soft);margin-top:8px}
.note.warn{background:var(--overBg);color:var(--over)}
.pend div{font-size:12.5px;padding:7px 10px;border-left:3px solid var(--held);background:var(--soft);border-radius:6px;margin-top:5px}

/* 底部导航 */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 0 6px;font-size:11px;color:var(--sub)}
nav button span{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--brand)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--sub);margin:18px 4px 4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.foot{font-size:11.5px;color:var(--faint);margin:8px 4px}
#msg{padding:40px 10px;text-align:center;color:var(--sub)}
/* 11/13 繁忙日排位 */
.pwintro{font-size:12.5px;color:var(--sub);margin:10px 4px 2px;line-height:1.6}
.pwday{display:flex;gap:6px;overflow-x:auto;margin:10px 0 4px;scrollbar-width:none}
.pwday::-webkit-scrollbar{display:none}
.pwday .chip{text-align:center;line-height:1.3;padding:6px 12px}
.pwday .chip small{display:block;font-size:11px;opacity:.8}
.pwsum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0 10px;font-size:13.5px;line-height:1.7}
.pwsum b{font-size:18px}
.pwd{padding:0 14px 12px;font-size:13px;line-height:1.65}
.pwd h4{margin:10px 0 2px;font-size:12.5px;color:var(--sub);font-weight:600}
.pwd ul{margin:0;padding-left:18px}
.pwfree{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 8px;font-size:12px;color:var(--sub);white-space:nowrap}
.pwfree span b{color:var(--ink)}
#keybox{display:none;padding:50px 24px;text-align:center}
#keybox img{width:72px;height:72px;border-radius:18px}
#keybox input{font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:12px;width:240px;max-width:80%;background:var(--card);color:var(--ink);text-align:center}
#keybox button{display:block;margin:12px auto 0;width:240px;max-width:80%;padding:12px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:600}
</style>
</head>
<body>
<header id="hdr">
  <div class="top">
    <h1>空桌一览</h1>
    <span class="live" id="live"><i class="dot"></i><span id="age">读取中</span></span>
    <button class="iconbtn" id="rf" onclick="load(true)" aria-label="刷新">↻</button>
  </div>
  <div id="banner"></div>
  <div class="stats" id="stats"></div>
  <div class="tools">
    <input id="q" placeholder="🔍 搜店名 / 地区" oninput="render()">
    <button class="sortbtn" id="sort" onclick="toggleSort()"></button>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main id="list"><div id="msg">读取中…</div></main>
<div id="keybox">
  <img src="icon-192.png" alt="">
  <p>第一次打开，请输入负责人给的访问密码</p>
  <input id="kin" autocomplete="off" autocapitalize="off" enterkeyhint="go" onkeydown="if(event.key==='Enter')saveKey()">
  <button onclick="saveKey()">开始使用</button>
  <p id="kerr" class="r"></p>
</div>
<nav id="nav">
  <button data-tab="all" onclick="setTab('all')"><span>🏬</span>全部店</button>
  <button data-tab="fav" onclick="setTab('fav')"><span>⭐</span>我的店</button>
  <button data-tab="free" onclick="setTab('free')"><span>🪑</span>现在有空桌</button>
  <button data-tab="pw" onclick="setTab('pw')"><span>📋</span>繁忙日排位</button>
</nav>
<script>
// 数据接口：Google Apps Script「实时桌位手机版」部署后的网址（/exec 结尾）
const API = 'https://script.google.com/macros/s/AKfycbxDX1OB8iAKYYpfBlncpfov66qsDdWfq6wjs2xNGydXDbkkUPf7NsOwwmd_PG2Dbpe0/exec';
let K = '';
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
K = LS.get('k', '');
// 密码：网址里的 #k=… 或 ?k=…，第一次带进来就记在这台手机上（加到主屏幕后 iPhone 要在 APP 里再输一次）
const fromUrl = (location.hash.match(/k=([^&]+)/) || location.search.match(/[?&]k=([^&]+)/) || [])[1];
if (fromUrl) { K = decodeURIComponent(fromUrl); LS.set('k', K); history.replaceState(null, '', location.pathname); }

let D = null, area = '', tab = LS.get('tab', 'all'), sortBy = LS.get('sort2', 'area');
let openSet = new Set(), closedSet = new Set(), autoOpen = false, favs = [], tileF = {};
let pwErr = false, PW = null, pwGot = 0, pwDate = '', pwOpen = new Set(), pwBusy = false;  // 11/13 繁忙日排位
try { favs = JSON.parse(LS.get('favs', '[]')); } catch (e) {}
if (tab === 'fav' && !favs.length) tab = 'all';

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST = { free: '空', used: '使用中', remind: '放题快结束', lo: 'L.O.', over: '放题超时', held: '预约留桌' };
const COLOR = { free: 'var(--free)', held: 'var(--held)', remind: 'var(--remind)', lo: 'var(--lo)', over: 'var(--over)' };

function saveKey() { K = document.getElementById('kin').value.trim(); if (!K) return; LS.set('k', K); document.getElementById('kerr').textContent = ''; load(true); }
function showKey(msg) {
  document.getElementById('keybox').style.display = 'block';
  ['hdr', 'list', 'nav'].forEach(id => document.getElementById(id).style.display = 'none');
  document.getElementById('kerr').textContent = msg || '';
}
function hideKey() {
  document.getElementById('keybox').style.display = 'none';
  document.getElementById('hdr').style.display = '';
  document.getElementById('list').style.display = '';
  document.getElementById('nav').style.display = 'flex';
}

function load(manual) {
  if (!K) { showKey(); return; }
  const rf = document.getElementById('rf');
  rf.classList.add('spin');
  fetch(API + '?fmt=json&k=' + encodeURIComponent(K), { cache: 'no-store' })
    .then(r => r.json())
    .then(d => {
      rf.classList.remove('spin');
      if (d.error === 'key') { LS.del('k'); K = ''; showKey('密码不对，请再确认一下'); return; }
      if (d.error) throw new Error(d.error);
      D = d; D.offline = false; D.got = Date.now();
      LS.set('last', JSON.stringify(d));
      hideKey(); render();
      if (tab === 'pw') loadPw();
    })
    .catch(() => {
      rf.classList.remove('spin');
      if (!D) { try { D = JSON.parse(LS.get('last', 'null')); } catch (e) {} }
      if (D) { D.offline = true; hideKey(); render(); }
      else { hideKey(); document.getElementById('list').innerHTML = '<div id="msg">连不上，稍后自动重试</div>'; }
    });
}

const parseT = s => { const m = String(s || '').match(/(\d{4})\/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})/); return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5]) : null; };
const nowMin = () => { const t = parseT(D && D.now); if (!t) return null; const extra = D.got ? Math.floor((Date.now() - D.got) / 60000) : 0; return t.getHours() * 60 + t.getMinutes() + extra; };
// 「2人 · 15:02 开台」→ 人数、坐了几分钟
function seat(t) {
  for (const x of t.x) {
    const m = x.match(/(\d+|\?)人\s*·\s*(\d{1,2}):(\d{2})\s*开台/);
    if (m) {
      const nm = nowMin(); let mins = null;
      if (nm != null) { mins = (nm - (+m[2] * 60 + +m[3]) + 1440) % 1440; }
      return { ppl: m[1], mins };
    }
  }
  return null;
}
const fmtMin = m => m == null ? '' : m < 60 ? m + '分' : Math.floor(m / 60) + '时' + String(m % 60).padStart(2, '0');

function setTab(t) { tab = t; LS.set('tab', t); window.scrollTo(0, 0); render(); if (t === 'pw') loadPw(); }
function toggleSort() { sortBy = sortBy === 'free' ? 'area' : 'free'; LS.set('sort2', sortBy); render(); }
function toggleFav(ev, label) {
  ev.stopPropagation();
  favs = favs.includes(label) ? favs.filter(x => x !== label) : favs.concat(label);
  LS.set('favs', JSON.stringify(favs)); render();
}
// 列表里 3 家以内（选了地区、搜了店名、我的店）时自动展开桌位图；手动收起的记在 closedSet
function isOpenS(label) { return openSet.has(label) || (autoOpen && !closedSet.has(label)); }
function toggleOpen(label) {
  if (isOpenS(label)) { openSet.delete(label); closedSet.add(label); }
  else { closedSet.delete(label); openSet.add(label); }
  render();
}
function setTileF(label, f) { tileF[label] = f; render(); }
function toggleTile(ev) { ev.currentTarget.classList.toggle('open'); }

function render() {
  if (!D) return;
  // 更新时间
  const st = parseT(D.stamp), nm = parseT(D.now);
  const age = st && nm ? Math.max(0, Math.round((nm - st) / 60000) + (D.got ? Math.floor((Date.now() - D.got) / 60000) : 0)) : null;
  const open = D.stores.filter(s => s.status === 'open' && s.n);
  const live = document.getElementById('live');
  live.className = 'live' + (age == null ? '' : age > 25 && open.length ? ' bad' : age > 15 ? ' warn' : '');
  document.getElementById('age').textContent = age == null ? '—' : (st.getHours() + ':' + String(st.getMinutes()).padStart(2, '0') + ' 更新 · ' + (age < 1 ? '刚刚' : age + ' 分前'));
  const banner = document.getElementById('banner');
  // 程序读空桌的时间：16:30 开始（周六 14:00），到 0:30（周五・周六营业日到 4:45）。开始 20 分钟后还超过 25 分钟没新数据 = 程序可能停了
  // 11/13：以前一律按 14:20 算，周五 14:20〜16:30 本来就还没开始读，却显示「程序可能停了」
  let inHours = false, beforeStart = false;
  if (nm) {
    const t = new Date(nm.getTime() + (D.got ? Date.now() - D.got : 0)), m = t.getHours() * 60 + t.getMinutes();

// ===== 11/13 繁忙日排位：未来 14 天的周五・周六・祝日・12 月忙日，各店有没有提前把预约排到桌上（每天读 2 次）=====

    .then(r => r.json())
    .then(d => { pwBusy = false; if (d.error) throw new Error(d.error); PW = d; pwGot = Date.now(); LS.set('pw', JSON.stringify(d)); if (tab === 'pw') render(); })
    .catch(() => { pwBusy = false; if (!PW) { try { PW = JSON.parse(LS.get('pw', 'null')); } catch (e) {} } if (!PW) pwErr = true; if (tab === 'pw') render(); });
}
const WD = '日一二三四五六';
function pwNow() { const t = parseT(D && D.now) || new Date(); return new Date(t.getTime() + (D && D.got ? Date.now() - D.got : 0)); }
function pwTodayStr() { const t = pwNow(); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); }
function pwDayLabel(ds) {
  const [y, m, d] = ds.split('-').map(Number), dt = new Date(y, m - 1, d);
  const t = pwNow(), t0 = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  const left = Math.round((dt - t0) / 86400000);

}
const pwRateCls = r => r >= 90 ? 'g' : r >= 50 ? 'm' : 'rr';
const pwAssigned = r => Math.round(r.groups * (r.rate || 0) / 100);
const pwCaps = () => { const c = (PW.rows || []).find(r => r.kind === 'cap'); return (c && c.caps) || {}; };
function pwStore(r) { return D.stores.find(s => s.rbKey && s.rbKey === r.key) || null; }
// 今天：每家店用实时预约（没读到的店用 13:14 那次的）
function pwTodayRows() {
  const td = pwTodayStr(), base = (PW.rows || []).filter(r => r.date === td && !r.kind), out = [];
  D.stores.forEach(s => {
    const rs = (s.rsv || []).filter(x => !/キャンセル/.test(x.status || ''));
    const old = base.find(x => x.key === s.rbKey);
    if (!rs.length) { if (old) out.push(old); return; }
    const ppl = x => +x.ppl || 0, un = rs.filter(x => !x.tbl);
    out.push(Object.assign({ clash: [], tight: [], over: [], broken: [], cannot: [], plan: [], free: null, has_seats: true, status_odd: 0 }, old || {}, {
      store: s.label, key: s.rbKey, date: td, live: true,
      groups: rs.length, people: rs.reduce((a, x) => a + ppl(x), 0), rate: Math.round(100 * (rs.length - un.length) / rs.length),

const pwSum = rs => ({ g: rs.reduce((a, r) => a + r.groups, 0), p: rs.reduce((a, r) => a + (r.people || 0), 0), as: rs.reduce((a, r) => a + pwAssigned(r), 0) });

    // 预约：这桌有人、下一组 30 分内要到；没排桌的预约 30 分内要到几组
    const clashN = s.tables.filter(t => clashOf(s, t)).length;
    if (clashN) badges += `<span class="bd over">⚠ 下一组快到、桌还没空 ${clashN}</span>`;
    const sn = soon(s);
    if (sn.length) best += `<div class="best ${sn.length > s.free ? 'wn' : 'sn'}">📅 30 分内要到 ${sn.length} 组 ${sn.reduce((a, r) => a + r.ppl, 0)} 人（没排桌）　现在空 ${s.free} 桌</div>`;
  }
  let body = '';
  if (isOpen) body = warnFull + detail(s);
  const canOpen = s.tables.length || s.info.length || s.pending.length || s.notes.length;
  return `<div class="card${s.status !== 'open' ? ' closed' : ''}">
    <div class="hd" onclick="toggleOpen(${L})">
      <button class="star${fav ? ' on' : ''}" onclick="toggleFav(event, ${L})" aria-label="设为我的店">${fav ? '★' : '☆'}</button>
      <div class="nm"><div class="area"><span class="stn">${esc(s.area)}</span></div><div class="sn">${esc(s.name)}</div>
        <div class="area">${sub}</div>${badges ? '<div class="badges">' + badges + '</div>' : ''}${seg}</div>
      <div class="big">${big}</div>
    </div>
    ${best}
    ${!isOpen && s.tables.length ? mini(s, L) : ''}
    ${isOpen ? '<div class="body">' + body + '</div>' : ''}
    ${canOpen ? `<button class="more" onclick="toggleOpen(${L})">${isOpen ? '收起 ▲' : '看桌位图 ▼'}</button>` : ''}
  </div>`;
}

// 卡片上的小桌位图：不用点开就能看到哪几桌空（点一下展开详细）
function mini(s, L) {
  return `<div class="mini" onclick="toggleOpen(${L})">` + s.tables.map(t =>
    `<i class="${t.s}${clashOf(s, t) ? ' cl' : ''}">${esc(String(t.t).replace(/（.*$/, ''))}</i>`).join('') + '</div>';
}

let curStore = null;  // tile() 要知道是哪家店（看这桌的下一组预约）
function detail(s) {
  curStore = s;
  const L = esc(JSON.stringify(s.label));
  const f = tileF[s.label] || 'all';
  const groups = { all: () => true, free: t => t.s === 'free', used: t => t.s !== 'free' && t.s !== 'held', held: t => t.s === 'held', alert: t => ['remind', 'lo', 'over'].includes(t.s) };
  const names = { all: '全部', free: '空桌', used: '使用中', held: '留桌', alert: '放题要注意' };
  let h = '';
  if (s.warn) h += `<div class="note warn">${esc(s.warn)}</div>`;
  if (s.tables.length) {
    h += '<div class="filters">' + Object.keys(groups).map(k => {
      const c = s.tables.filter(groups[k]).length;
      return (k === 'all' || c) ? `<button class="chip${f === k ? ' on' : ''}" onclick='setTileF(${L},"${k}")'>${names[k]} ${c}</button>` : '';
    }).join('') + '</div>';
    h += '<div class="tiles">' + s.tables.map(t => tile(t, groups[f](t))).join('') + '</div>';
  }
  // ③ 空位时间 → 时间线
  const third = s.info.find(x => /^③/.test(x));
  if (third) {
    const items = third.replace(/^③[^：]*：/, '').split('｜').map(x => x.trim()).filter(Boolean);
    if (items.length) {
      h += '<h3>什么时候会空出来（早→迟）</h3><div class="tl">' + items.map(x => {
        const m = x.match(/^(现在～预约前|现在|快空[^）]*）|\d{1,2}:\d{2}|时间不明[^）]*）)\s*(.*)$/);
        const label = m ? m[1].replace(/（.*$/, '') : '';
        const rest = m ? m[2] : x;
        return `<div class="${/^现在/.test(label) ? 'now' : ''}"><b>${esc(label || '')}</b> ${esc(rest)}</div>`;
      }).join('') + '</div>';
    }
  }
  s.notes.forEach(x => h += `<div class="note${/⚠/.test(x) ? ' warn' : ''}">${esc(x)}</div>`);
  if (s.rsv) h += ledger(s);
  else if (s.pending.length) h += '<h3>还没分配到桌的预约</h3><div class="pend">' + s.pending.map(p => `<div>${p.map(esc).join('　')}</div>`).join('') + '</div>';
  return h;
}

// ---------- 预约（11/12）：今日预约清单、每桌下一组、「下一组快到了这桌还没空」 ----------
// 营业到半夜：5 点前的时间算前一天的延续（+24 小时）
const toM = hm => { const m = String(hm || '').match(/(\d{1,2}):(\d{2})/); if (!m) return null; const v = +m[1] * 60 + +m[2]; return +m[1] < 5 ? v + 1440 : v; };
const nowM = () => { const v = nowMin(); return v == null ? null : (v < 300 ? v + 1440 : v); };
const rbM = () => { const m = String(D.rbStamp || '').match(/\s(\d{1,2}:\d{2})/); return m ? toM(m[1]) : null; };
const isWait = r => /来店待/.test(r.status);
const isIn = r => /来店済/.test(r.status);
const isGone = r => /会計済|退店/.test(r.status);
// 桌号统一成数字：PE「11（4人桌）」「カウンター13」→ 11、13；レストランボード「テーブル席51+テーブル席52」「1卓（テ・個）※…」→ 51、52、1
const numOf = s => { const m = String(s || '').replace(/（.*$/, '').replace(/※.*$/, '').match(/(\d+)/); return m ? String(+m[1]) : null; };
// 「個室9」「半個室」「6名~」这种和 PE 桌号对不准，不硬对（只在预约清单里显示原文）
const rbNums = tbl => String(tbl || '').split(/[+＋,，、・\/]/).filter(p => !/個室|名/.test(p)).map(numOf).filter(Boolean);
// 某桌接下来还没到的预约（开始前 / 开始后 60 分内）
function nextFor(s, t) {
  if (!s.rsv) return null;
  const n = numOf(t.t), now = nowM();
  if (!n || now == null) return null;
  return s.rsv.filter(r => isWait(r) && rbNums(r.tbl).includes(n) && toM(r.st) >= now - 60)
    .sort((a, b) => toM(a.st) - toM(b.st))[0] || null;
}
// 这桌有人在坐，下一组 30 分内要到（或已过点）→ 提醒
function clashOf(s, t) {
  if (t.s === 'free' || t.s === 'held') return null;
  const r = nextFor(s, t), now = nowM();
  if (!r) return null;
  const d = toM(r.st) - now;
  return d <= 30 ? { r, d } : null;
}
// 30 分内要到、还没排桌的预约
function soon(s) {
  const now = nowM();
  if (!s.rsv || now == null) return [];
  return s.rsv.filter(r => isWait(r) && !r.tbl && toM(r.st) >= now - 15 && toM(r.st) <= now + 30);
}
function rsvChip(r) {
  if (isIn(r)) return '<span class="rc in">已到</span>';
  if (isGone(r)) return '<span class="rc gone">已走</span>';
  if (!isWait(r)) return `<span class="rc">${esc(r.status || '—')}</span>`;
  const now = nowM(), st = toM(r.st), rb = rbM();
  if (now == null || st == null) return '<span class="rc">未到</span>';
  if (now < st) return `<span class="rc">${st - now} 分后</span>`;
  // 预约状态是 レストランボード 上次读到的；开始时间比那次还晚，就还不知道到没到
  if (rb != null && st > rb) return '<span class="rc">状态待更新</span>';
  const late = now - st;
  return `<span class="rc ${late > 15 ? 'late2' : late >= 5 ? 'late1' : ''}">${late < 5 ? '刚到点' : '迟到 ' + late + ' 分'}</span>`;
}
function ledger(s) {
  const list = s.rsv.slice().sort((a, b) => toM(a.st) - toM(b.st));
  if (!list.length) return '<h3>今日预约</h3><div class="note">今天没有 レストランボード 的预约</div>';
  const ppl = list.reduce((a, r) => a + r.ppl, 0), wait = list.filter(isWait).length;
  const hm = (String(D.rbStamp || '').match(/\s(\d{1,2}:\d{2})/) || [])[1] || '?';
  return `<h3>今日预约　${list.length} 组 ${ppl} 人<small>　未到 ${wait} 组 · 状态是 ${esc(hm)} 读到的</small></h3><div class="ldg">` +
    list.map(r => `<div class="${isGone(r) ? 'gone' : ''}"><span class="lt">${esc(r.st)}</span><span class="ln"><b>${esc(r.name)} 様</b> ${r.ppl}名<br><small>${r.tbl ? '🪑 ' + esc(r.tbl) : '没排桌'}${r.course ? '　' + esc(r.course) : ''}</small></span>${rsvChip(r)}</div>`).join('') + '</div>';
}

function tile(t, show) {
  const S = curStore;
  const nx = S ? nextFor(S, t) : null, cl = S ? clashOf(S, t) : null;
  const se = t.s === 'free' || t.s === 'held' ? null : seat(t);
  let line = '';
  if (t.s === 'free') line = '';
  else if (se) line = esc(se.ppl) + '人 · ' + fmtMin(se.mins);
  const rest = t.x.filter(x => !/开台$/.test(x));
  // 坐了多久：底部细条，90 分满格
  const bar = se && se.mins != null ? `<i class="tm" style="width:${Math.min(100, se.mins / 90 * 100)}%;color:${se.mins >= 120 ? 'var(--over)' : se.mins >= 90 ? 'var(--remind)' : 'var(--used)'}"></i>` : '';
  const nxt = nx && t.s !== 'held' ? `<div class="nx${cl ? ' cl' : ''}">${cl ? '⚠ ' + (cl.d >= 0 ? cl.d + ' 分后' : '已过 ' + (-cl.d) + ' 分') + '下一组到，还没空<br>' : '📅 下一组 '}${esc(nx.st)} ${nx.ppl}名 ${esc(nx.name)}</div>` : '';
  return `<div class="tile ${t.s}${show ? '' : ' dim'}${cl ? ' clash' : ''}" onclick="toggleTile(event)">
    <b>${esc(t.t)}</b><div class="st">${ST[t.s]}${line ? '<span style="font-weight:400;color:var(--ink)"> ' + line + '</span>' : ''}</div>
    ${nxt}${rest.length ? `<div class="x">${rest.map(esc).join('<br>')}</div>` : ''}${bar}</div>`;
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
document.getElementById('nav').style.display = 'flex';
load();
setInterval(load, 60000);
setInterval(() => { if (D) render(); }, 30000);  // 「几分前」「坐了多久」跟着走
document.addEventListener('visibilitychange', () => { if (!document.hidden && K) load(); });
</script>
</body>
