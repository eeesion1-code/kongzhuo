<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>空桌一览</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="空桌一览">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--ink:#16181d;--sub:#6b7280;--faint:#9ca3af;--line:#e6e8ec;--soft:#f0f2f5;
  --brand:#1d4ed8;--brandInk:#fff;
  --free:#16a34a;--freeBg:#ecfdf3;
  --used:#64748b;--usedBg:#f1f5f9;
  --remind:#b45309;--remindBg:#fef3c7;
  --lo:#c2410c;--loBg:#ffedd5;
  --over:#dc2626;--overBg:#fee2e2;
  --held:#2563eb;--heldBg:#dbeafe;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1115;--card:#181b21;--ink:#eceef2;--sub:#a1a7b3;--faint:#6b7280;--line:#2a2f38;--soft:#20242c;
    --brand:#3b82f6;
    --free:#22c55e;--freeBg:#11281a;--used:#94a3b8;--usedBg:#1f242c;--remind:#facc15;--remindBg:#2f2a10;
    --lo:#fb923c;--loBg:#33210f;--over:#f87171;--overBg:#361515;--held:#60a5fa;--heldBg:#132544;
    --shadow:none;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Hiragino Sans","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.r{color:var(--over)}

/* 顶部 */
header{background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 14px 8px}
.top{display:flex;align-items:center;gap:10px}
h1{font-size:20px;margin:0;flex:1;letter-spacing:.5px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--free)}
.live.warn .dot{background:var(--remind)} .live.bad .dot{background:var(--over)} .live.bad{color:var(--over)}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:17px}
.iconbtn.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#banner{display:none;margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--overBg);color:var(--over);font-size:13px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stats.own{grid-template-columns:repeat(2,1fr)}
@media (min-width:700px){.stats.own{grid-template-columns:1.4fr 1fr 1fr 1fr}}
.stat.sales b{color:var(--brand)}
.yen{color:var(--brand);font-weight:600}
#banner.stop{font-size:14px;font-weight:600;padding:10px 12px;border:1.5px solid var(--over)}
#banner.info{background:var(--soft);color:var(--sub)}
/* 11/13 手机「让电脑重新登录」（老板） */
#rlhint{display:none;margin-top:8px;padding:6px 6px 6px 10px;border-radius:10px;background:var(--soft);color:var(--sub);font-size:12.5px;line-height:1.5;align-items:center;justify-content:space-between;gap:8px}
#rlhint.warn{background:#fef3c7;color:#78350f}
#rlhint button{flex:none;border:0;background:var(--brand);color:#fff;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600}
#rlView{display:none;position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);align-items:flex-end;justify-content:center}
.rlbox{background:var(--card);color:var(--ink);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom))}
.rlbox h3{margin:0 0 8px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.rlst{font-size:14px;margin:6px 0}
.rlres{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.6;margin:8px 0}
.rlnote{font-size:12.5px;color:var(--sub);line-height:1.55;margin:8px 0}
.rlgo{display:block;width:100%;margin-top:10px;padding:12px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-size:15px;font-weight:600}
.rlpw{border-top:1px solid var(--line);margin-top:14px;padding-top:10px}
.rlpw b{font-size:14.5px}
.rlpw select,.rlpw input{display:block;width:100%;box-sizing:border-box;margin-top:8px;padding:10px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.rlpw .rlgo{background:#16a34a}
.rlerr{color:var(--over);font-size:13px;margin-top:6px}
.stat{background:var(--card);border-radius:12px;padding:8px 10px;box-shadow:var(--shadow);border:1px solid var(--line)}
.stat small{display:block;font-size:11px;color:var(--sub)}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.stat b em{font-style:normal;font-size:12px;color:var(--sub);font-weight:400}

.tools{display:flex;gap:8px;margin-top:10px}
#q{flex:1;min-width:0;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.sortbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 12px;font-size:13px;white-space:nowrap}
/* 11/13 集团总营业额（老板） */
.salesbtn{display:none;border:0;background:var(--brand);color:#fff;border-radius:10px;padding:0 12px;font-size:13px;font-weight:600;white-space:nowrap}
.stat.sales{cursor:pointer}
#salesView{display:none;position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.svwrap{max-width:720px;margin:0 auto;padding:12px 14px calc(30px + env(safe-area-inset-bottom))}
.svtop{display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--bg);padding:6px 0 8px;z-index:2}
.svtop h2{flex:1;margin:0;font-size:19px}
.svtools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
.svtools input{font:inherit;font-size:16px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.svmon{display:flex;align-items:center;justify-content:space-between;margin:10px 0 4px}
.svmon b{font-size:16px}
.svmsum{font-size:13px;color:var(--sub);margin:2px 2px 6px;line-height:1.6}
.svmsum b{color:var(--ink)}
.svcal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.svcal>b{text-align:center;font-size:12px;color:var(--sub);font-weight:500}
.svcal .bl{color:#2563eb}
.svd{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 0 3px;min-height:46px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink)}
.svd i{font-style:normal;font-size:13px;font-weight:600}
.svd small{font-size:10.5px;font-variant-numeric:tabular-nums}
.svd:disabled{opacity:.35}
.svd.td{border-color:var(--brand)}
.svd.on{outline:2.5px solid var(--ink);outline-offset:-1px}
.svday{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.svhd{font-weight:600;font-size:15px}
.svhd small{font-weight:400;color:var(--sub);margin-left:6px;font-size:12px}
.svtot{font-size:28px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.svtot small{font-size:13px;font-weight:400;color:var(--sub)}
.svsub{font-size:13px;color:var(--sub);line-height:1.6;margin-bottom:8px}
.svlist>div{display:grid;grid-template-columns:22px auto 1fr auto;gap:2px 8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.svlist em{font-style:normal;color:var(--faint);font-size:12px;text-align:right}
.svlist .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.svlist b{font-variant-numeric:tabular-nums}
.svlist small{grid-column:3/5;color:var(--sub);font-size:11.5px;margin-top:-4px}
/* 11/13 月预测 */
.svfc{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;padding:8px 10px;margin:4px 0 8px;font-size:14px}
.svfc b{font-size:16px}
.svfc small{display:block;color:var(--sub);font-size:12px;line-height:1.55;margin-top:2px}
.svd .fc{color:var(--sub);font-size:10px}
.svd i .rr{font-size:9px;margin-left:1px}
.svmiss{background:#fef3c7;color:#78350f;border-radius:8px;padding:7px 9px;font-size:12.5px;line-height:1.55;margin:6px 0 4px}
/* 11/13 时段营业额 */
.svseg{display:flex;gap:6px;align-items:center;margin:14px 0 4px}
.svseg>b{flex:1;font-size:14.5px}
.svpk{font-size:12.5px;color:var(--sub);margin:0 0 6px}
.svhr2>div{display:grid;grid-template-columns:42px 1fr 50px 46px;gap:7px;align-items:center;font-size:12.5px;padding:3px 0}
.svhr2.wg>div{grid-template-columns:42px 1fr 48px 34px 44px;gap:6px}
.svhr2 span{color:var(--sub);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.svhr2 .lu span{font-size:11.5px}
.svhr2 i{position:relative;height:13px;background:var(--soft);border-radius:4px}
.svhr2 u{position:absolute;left:0;top:0;bottom:0;background:var(--free);border-radius:0 4px 4px 0}
.svhr2 s{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink);opacity:.6}
.svhr2 b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.svhr2 em{font-style:normal;color:var(--faint);font-size:11.5px;text-align:right}
.svhr2 .dl{text-align:right;font-size:12px}
.svhr2 p{margin:8px 0 2px;font-size:11.5px;color:var(--faint);border-top:1px dashed var(--line);padding-top:6px}
.svhr>div{display:grid;grid-template-columns:34px 1fr 50px 38px;gap:6px;align-items:center;font-size:12.5px;padding:2px 0}
.svhr span{color:var(--sub);text-align:right}
.svhr i{position:relative;height:14px;background:var(--soft);border-radius:4px}
.svhr u{position:absolute;left:0;top:0;bottom:0;background:#16a34a;border-radius:4px}
.svhr s{position:absolute;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:var(--ink);opacity:.5}
.svhr b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.svhr em{font-style:normal;color:var(--faint);font-size:11.5px;text-align:right}
.svhr.cmp>div{grid-template-columns:32px 1fr 46px 34px 42px}
.svhr var{font-style:normal;font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.svcmp{font-size:12.5px;color:var(--sub);margin:2px 0 6px;line-height:1.6}
.svcmp b{color:var(--ink)}
.svhrnote{font-size:11.5px;color:var(--faint);margin:6px 0 10px;line-height:1.55}
.svlist>div.can{cursor:pointer}
.svlist .nm .ar{color:var(--faint);font-size:11px}
.svst{grid-column:1/-1;padding:4px 0 6px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* 店铺卡片 */
main{padding:4px 14px 20px;max-width:1400px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:10px;align-items:start}
.grid .card{margin-bottom:0}
/* 11/14 不丝滑：屏幕外的卡片先不排版不画（滑到才画，看起来一样）；按钮去掉双击放大的等待 */
.card{content-visibility:auto;contain-intrinsic-size:auto 170px}
button,.hd,.mini,.tile,.svd,.chip{touch-action:manipulation}
.stn{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--soft);color:var(--ink);font-weight:600;font-size:12px}
.sec{font-size:12px;color:var(--sub);margin:14px 4px 6px;letter-spacing:.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.hd{display:flex;gap:10px;padding:12px 12px 10px;align-items:flex-start}
.star{border:0;background:none;font-size:20px;line-height:1;padding:2px 0 0;color:var(--faint)}
.star.on{color:#f59e0b}
.nm{flex:1;min-width:0}
.area{font-size:12px;color:var(--sub)}
.sn{font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{text-align:right;white-space:nowrap;line-height:1.1}
.big b{font-size:28px;font-variant-numeric:tabular-nums}
.big small{display:block;font-size:12px;color:var(--sub)}
.g{color:var(--free)} .m{color:var(--remind)} .rr{color:var(--over)}
.seg{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--usedBg);margin-top:8px}
.seg i{height:100%}
.best{margin:0 12px 10px;padding:8px 10px;border-radius:10px;background:var(--soft);font-size:13px}
.best b{font-weight:600}
.mini{display:flex;flex-wrap:wrap;gap:3px;margin:0 12px 10px;cursor:pointer}
.mini i{font-style:normal;min-width:26px;height:20px;padding:0 3px;border-radius:5px;font-size:10px;line-height:20px;text-align:center;background:var(--usedBg);color:var(--used);box-sizing:border-box}
.mini i.free{background:var(--free);color:#fff}
.mini i.held{background:var(--held);color:#fff}
.mini i.remind{background:var(--remindBg);color:var(--remind);box-shadow:inset 0 0 0 1.5px var(--remind)}
.mini i.lo{background:var(--loBg);color:var(--lo);box-shadow:inset 0 0 0 1.5px var(--lo)}
.mini i.over{background:var(--over);color:#fff}
.mini i.cl{outline:2px solid var(--over);outline-offset:1px}
/* 预约 */
.best.sn{margin-top:-6px;background:var(--heldBg);color:var(--held)}
.tile .nx{font-size:11px;margin-top:3px;color:var(--held);line-height:1.35}
.tile .nx.cl{color:var(--over);font-weight:600}
.tile.clash{border:2px solid var(--over)}
h3 small{font-weight:400;color:var(--sub);font-size:12px}
.ldg{display:grid;gap:4px;margin-top:6px}
.ldg>div{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:7px 10px;border-radius:8px;background:var(--soft);font-size:13px;line-height:1.35}
.ldg>div.gone{opacity:.5}
.ldg .lt{font-variant-numeric:tabular-nums;font-weight:600}
.ldg small{color:var(--sub);font-size:11.5px}
.ldg .ln{min-width:0;overflow-wrap:anywhere}
.rc{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--usedBg);color:var(--used);white-space:nowrap}
.rc.in{background:var(--freeBg);color:var(--free)}
.rc.gone{background:transparent}
.rc.late1{background:var(--remindBg);color:var(--remind)}
.rc.late2{background:var(--overBg);color:var(--over)}
.best.wn{margin-top:-6px;background:#fef3c7;color:#92400e}
.body>.best.wn{margin:8px 0}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.bd{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--sub)}
.bd.held{background:var(--heldBg);color:var(--held)} .bd.remind{background:var(--remindBg);color:var(--remind)}
.bd.lo{background:var(--loBg);color:var(--lo)} .bd.over{background:var(--overBg);color:var(--over)}
.closed .sn,.closed .big{opacity:.5}
.more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:9px;font-size:13px;color:var(--brand)}

/* 展开后 */
.body{padding:0 12px 12px}
.filters{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;margin-top:8px;align-items:start}
.tile{position:relative;border-radius:10px;padding:6px 7px 7px;min-height:58px;font-size:11.5px;line-height:1.3;overflow:hidden;background:var(--usedBg);border:1px solid transparent}
.tile b{display:block;font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:.2px}
.tile .st{font-weight:600}
.tile .x{color:var(--sub);margin-top:2px;word-break:break-all}
.tile .tm{position:absolute;left:0;bottom:0;height:3px;background:currentColor;opacity:.5}
.tile.free{background:var(--freeBg);border:1.5px dashed var(--free);min-height:44px}
.tile.free .st{color:var(--free)}
.tile.used .st{color:var(--used)}
.tile.remind{background:var(--remindBg)} .tile.remind .st{color:var(--remind)}
.tile.lo{background:var(--loBg)} .tile.lo .st{color:var(--lo)}
.tile.over{background:var(--overBg)} .tile.over .st{color:var(--over)}
.tile.held{background:var(--heldBg)} .tile.held .st{color:var(--held)}
.tile.dim{opacity:.18}
.tile.open{grid-column:1/-1}
h3{font-size:13px;margin:14px 2px 6px;color:var(--sub);font-weight:600}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:12px}
.tl div{position:relative;padding:4px 0;font-size:13px}
.tl div::before{content:"";position:absolute;left:-17px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--faint)}
.tl div.now::before{background:var(--free)}
.tl b{display:inline-block;min-width:52px;font-variant-numeric:tabular-nums}
.note{font-size:12.5px;padding:8px 10px;border-radius:10px;background:var(--soft);margin-top:8px}
.note.warn{background:var(--overBg);color:var(--over)}
.pend div{font-size:12.5px;padding:7px 10px;border-left:3px solid var(--held);background:var(--soft);border-radius:6px;margin-top:5px}

/* 底部导航 */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 0 6px;font-size:11px;color:var(--sub)}
nav button span{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--brand)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--sub);margin:18px 4px 4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.foot{font-size:11.5px;color:var(--faint);margin:8px 4px}
#msg{padding:40px 10px;text-align:center;color:var(--sub)}
/* 11/13 繁忙日排位 */
.pwintro{font-size:12.5px;color:var(--sub);margin:10px 4px 2px;line-height:1.6}
.pwday{display:flex;gap:6px;overflow-x:auto;margin:10px 0 4px;scrollbar-width:none}
.pwday::-webkit-scrollbar{display:none}
.pwday .chip{text-align:center;line-height:1.3;padding:6px 12px}
.pwday .chip small{display:block;font-size:11px;opacity:.8}
.pwsum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0 10px;font-size:13.5px;line-height:1.7}
.pwsum b{font-size:18px}
.pwd{padding:0 14px 12px;font-size:13px;line-height:1.65}
.pwd h4{margin:10px 0 2px;font-size:12.5px;color:var(--sub);font-weight:600}
.pwd ul{margin:0;padding-left:18px}
.pwfree{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 8px;font-size:12px;color:var(--sub);white-space:nowrap}
.pwfree span b{color:var(--ink)}
#keybox{display:none;padding:50px 24px;text-align:center}
#keybox img{width:72px;height:72px;border-radius:18px}
#keybox input{font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:12px;width:240px;max-width:80%;background:var(--card);color:var(--ink);text-align:center}

.svcmpsum{font-size:13px;color:var(--sub);margin:0 0 6px}

.svbands>div{display:grid;grid-template-columns:70px 1fr 52px 50px;gap:8px;align-items:center;padding:5px 0;font-size:13px}

.svdbar{display:flex;gap:6px;align-items:center;margin:2px 0 4px}

.svdlab input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.svdbar .iconbtn:disabled{opacity:.35}
.svmini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.svmini>div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 9px;font-size:11.5px;color:var(--sub);line-height:1.35}
.svcard .svmini>div{background:var(--soft);border:0}
.svmini b{display:block;color:var(--ink);font-size:16px;font-weight:800;margin:2px 0 1px}

.svcmpt{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}

.svcmpt th:nth-child(n+3),.svcmpt td:nth-child(n+3){text-align:right}
.svcmpt td{padding:7px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}

.svlinks{display:flex;gap:8px;margin-top:10px}

.svfcm button.on{background:var(--soft);font-weight:700}

.svfcm i{position:relative;height:12px;background:var(--soft);border-radius:4px}

.svfcm u{position:absolute;left:0;top:0;bottom:0;background:var(--fcbar);border-radius:4px}
.svfcm s{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.svfcm b{text-align:right;font-variant-numeric:tabular-nums}
.svfcm .dl{text-align:right;font-size:12px}
/* 11/14 期间（自选）*/
.hol{color:#dc2626;font-weight:600}
.wkh{white-space:nowrap}
.svholi{font-size:12.5px;margin:6px 2px 0;line-height:1.6}
.svcmprule{font-size:12px;color:var(--sub);margin:4px 2px 6px;line-height:1.5}
.svd em.cd{font-style:normal;font-size:9px;color:var(--sub);line-height:1.1;letter-spacing:-.2px}
.svd i{position:relative}
.svd i .hdot{position:absolute;top:0;right:-7px;width:5px;height:5px;border-radius:50%;background:#dc2626}
.svrgm{display:flex;gap:6px;margin:2px 0 8px}
.svrgm button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:10px;padding:8px 4px;font-size:14px}
.svrgm button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
button.svdlab{color:var(--ink);font-family:inherit;line-height:1.3}
.svrgq{margin:0 0 4px}
.svrgcal .svd{min-height:42px}
.svrgcal .svd.in{background:var(--soft);border-color:var(--sub)}
.svrgcal .svd.end{background:var(--ink);border-color:var(--ink)}
.svrgcal .svd.end i,.svrgcal .svd.end small{color:var(--bg)}
.svrgst{text-align:center;font-weight:700;font-size:14.5px;margin:10px 0 2px}
.svlinks button.ok{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.svlinks button:disabled{opacity:.4}
</style>
</head>
<body>
<header id="hdr">
  <div class="top">
    <h1>空桌一览</h1>
    <span class="live" id="live"><i class="dot"></i><span id="age">读取中</span></span>
    <button class="iconbtn" id="rf" onclick="load(true)" aria-label="刷新">↻</button>
  </div>
  <div id="banner"></div>
  <div id="rlhint"></div>
  <div class="stats" id="stats"></div>
  <div class="tools">
    <input id="q" placeholder="🔍 搜店名 / 地区" oninput="onSearch()">
    <button class="sortbtn" id="sort" onclick="toggleSort()"></button>
    <button class="salesbtn" id="salesBtn" onclick="openSales()">💴 集团总营业额</button>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main id="list"><div id="msg">读取中…</div></main>
<div id="keybox">
  <img src="icon-192.png" alt="">
  <p id="ktip">第一次打开，请输入负责人给的访问密码</p>
  <input id="kin" autocomplete="off" autocapitalize="off" enterkeyhint="go" onkeydown="if(event.key==='Enter')saveKey()">
  <button onclick="saveKey()">开始使用</button>
  <button id="kcancel" class="kback" onclick="hideKey()">取消</button>
  <p id="kerr" class="r"></p>
</div>
<div id="salesView"><div class="svwrap">
  <div class="svtop"><button class="iconbtn" onclick="closeSales()" aria-label="返回">‹</button><h2>💴 集团总营业额</h2></div>
  <div id="svBody"></div>
</div></div>
<div id="rlView" onclick="if(event.target===this)closeRelogin()"><div class="rlbox">
  <h3>🖥️ 让电脑重新登录<button class="iconbtn" onclick="closeRelogin()" aria-label="关闭">✕</button></h3>
  <div id="rlBody"></div>
</div></div>
<nav id="nav">
  <button data-tab="all" onclick="setTab('all')"><span>🏬</span>全部店</button>
  <button data-tab="fav" onclick="setTab('fav')"><span>⭐</span>我的店</button>
  <button data-tab="free" onclick="setTab('free')"><span>🪑</span>现在有空桌</button>
  <button data-tab="pw" onclick="setTab('pw')"><span>📋</span>繁忙日排位</button>
</nav>
<script>
// 数据接口：Google Apps Script「实时桌位手机版」部署后的网址（/exec 结尾）
const API = 'https://script.google.com/macros/s/AKfycbxDX1OB8iAKYYpfBlncpfov66qsDdWfq6wjs2xNGydXDbkkUPf7NsOwwmd_PG2Dbpe0/exec';
const APPV = 'kongzhuo-v36';  // 版本号：和 sw.js 的 V 一起改（下面 checkUpdate 用）
let K = '';
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
K = LS.get('k', '');
// 密码：网址里的 #k=… 或 ?k=…，第一次带进来就记在这台手机上（加到主屏幕后 iPhone 要在 APP 里再输一次）
const fromUrl = (location.hash.match(/k=([^&]+)/) || location.search.match(/[?&]k=([^&]+)/) || [])[1];
if (fromUrl) { K = decodeURIComponent(fromUrl); LS.set('k', K); history.replaceState(null, '', location.pathname); }

let D = null, area = '', tab = LS.get('tab', 'all'), sortBy = LS.get('sort2', 'area');
let openSet = new Set(), closedSet = new Set(), autoOpen = false, favs = [], tileF = {};
let pwErr = false, PW = null, pwGot = 0, pwDate = '', pwOpen = new Set(), pwBusy = false;  // 11/13 繁忙日排位
try { favs = JSON.parse(LS.get('favs', '[]')); } catch (e) {}
if (tab === 'fav' && !favs.length) tab = 'all';

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST = { free: '空', used: '使用中', remind: '放题快结束', lo: 'L.O.', over: '放题超时', held: '预约留桌' };
const COLOR = { free: 'var(--free)', held: 'var(--held)', remind: 'var(--remind)', lo: 'var(--lo)', over: 'var(--over)' };

function saveKey() {
  const v = document.getElementById('kin').value.trim(); if (!v) return;
  K = v; LS.set('k', K); document.getElementById('kerr').textContent = '';
  SV = null; svErr = ''; svGot = 0; svCacheDel(); PW = null; pwGot = 0; LS.del('pw');  // 换了密码：老板 / 店长看到的不一样，重新读（手机里存的营业额也删掉）
  load(true);
}
// 11/13 换密码（老板 / 店长）：iPhone 加到主屏幕的 APP 记着旧密码，只能在这里换
function changeKey() {
  document.getElementById('kin').value = '';
  document.getElementById('ktip').textContent = '输入新密码（老板密码可以看集团总营业额）';
  showKey('');
  document.getElementById('kcancel').style.display = D ? 'block' : 'none';
}
function showKey(msg) {
  document.getElementById('kcancel').style.display = 'none';
  document.getElementById('keybox').style.display = 'block';
  ['hdr', 'list', 'nav'].forEach(id => document.getElementById(id).style.display = 'none');
  document.getElementById('kerr').textContent = msg || '';
}
function hideKey() {
  document.getElementById('keybox').style.display = 'none';
  document.getElementById('hdr').style.display = '';
  document.getElementById('list').style.display = '';
  document.getElementById('nav').style.display = 'flex';
}

function load(manual) {
  if (!K) { showKey(); return; }
  // 11/14 用户：网页卡 → 一打开先显示手机里存的上次数据（「几分前」照实算），新数据回来再换，不用干等
  if (!D) { try { D = JSON.parse(LS.get('last', 'null')); } catch (e) {} if (D) { D.offline = false; hideKey(); render(); } }
  const rf = document.getElementById('rf');
  rf.classList.add('spin');
  fetch(API + '?fmt=json&k=' + encodeURIComponent(K), { cache: 'no-store' })
    .then(r => r.json())
    .then(d => {
      rf.classList.remove('spin');
      if (d.error === 'key') { LS.del('k'); K = ''; showKey('密码不对，请再确认一下'); return; }
      if (d.error) throw new Error(d.error);
      D = d; D.offline = false; D.got = Date.now();
      LS.set('last', JSON.stringify(d));
      hideKey();
      if (!svOpen()) renderSoon(); else if (svTab === 'ov') renderSoon(renderSales);   // 营业额页开着时不重画底下看不见的首页（关掉时再画）
      if (tab === 'pw') loadPw();
      if (D.owner && !SV) setTimeout(svPrefetch, 2000);   // 老板：先把营业额准备好，点开就有
    })
    .catch(() => {
      rf.classList.remove('spin');
      if (!D) { try { D = JSON.parse(LS.get('last', 'null')); } catch (e) {} }
      if (D) { D.offline = true; hideKey(); render(); }
      else { hideKey(); document.getElementById('list').innerHTML = '<div id="msg">连不上，稍后自动重试</div>'; }
    });
}

const parseT = s => { const m = String(s || '').match(/(\d{4})\/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})/); return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5]) : null; };
const nowMin = () => { const t = parseT(D && D.now); if (!t) return null; const extra = D.got ? Math.floor((Date.now() - D.got) / 60000) : 0; return t.getHours() * 60 + t.getMinutes() + extra; };
// 「2人 · 15:02 开台」→ 人数、坐了几分钟
function seat(t) {
  for (const x of t.x) {
    const m = x.match(/(\d+|\?)人\s*·\s*(\d{1,2}):(\d{2})\s*开台/);
    if (m) {
      const nm = nowMin(); let mins = null;
      if (nm != null) { mins = (nm - (+m[2] * 60 + +m[3]) + 1440) % 1440; }
      return { ppl: m[1], mins };
    }
  }
  return null;
}
const fmtMin = m => m == null ? '' : m < 60 ? m + '分' : Math.floor(m / 60) + '时' + String(m % 60).padStart(2, '0');

function setTab(t) { tab = t; LS.set('tab', t); window.scrollTo(0, 0); render(); if (t === 'pw') loadPw(); }
function toggleSort() { sortBy = sortBy === 'free' ? 'area' : 'free'; LS.set('sort2', sortBy); render(); }
function toggleFav(ev, label) {
  ev.stopPropagation();
  favs = favs.includes(label) ? favs.filter(x => x !== label) : favs.concat(label);
  LS.set('favs', JSON.stringify(favs)); render();
}
// 列表里 3 家以内（选了地区、搜了店名、我的店）时自动展开桌位图；手动收起的记在 closedSet
function isOpenS(label) { return openSet.has(label) || (autoOpen && !closedSet.has(label)); }
function toggleOpen(label) {
  if (isOpenS(label)) { openSet.delete(label); closedSet.add(label); }
  else { closedSet.delete(label); openSet.add(label); }
  render();
}
function setTileF(label, f) { tileF[label] = f; render(); }
function toggleTile(ev) { ev.currentTarget.classList.toggle('open'); }

function render() {
  if (!D) return;
  // 更新时间
  const st = parseT(D.stamp), nm = parseT(D.now);
  const age = st && nm ? Math.max(0, Math.round((nm - st) / 60000) + (D.got ? Math.floor((Date.now() - D.got) / 60000) : 0)) : null;
  const open = D.stores.filter(s => s.status === 'open' && s.n);
  const live = document.getElementById('live');
  live.className = 'live' + (age == null ? '' : age > 25 && open.length ? ' bad' : age > 15 ? ' warn' : '');
  document.getElementById('age').textContent = age == null ? '—' : (st.getHours() + ':' + String(st.getMinutes()).padStart(2, '0') + ' 更新 · ' + (age < 1 ? '刚刚' : age + ' 分前'));
  const banner = document.getElementById('banner');
  // 程序读空桌的时间：16:30 开始（周六 14:00），到 0:30（周五・周六营业日到 4:45）。开始 20 分钟后还超过 25 分钟没新数据 = 程序可能停了
  // 11/13：以前一律按 14:20 算，周五 14:20〜16:30 本来就还没开始读，却显示「程序可能停了」
  let inHours = false, beforeStart = false;
  if (nm) {
    const t = new Date(nm.getTime() + (D.got ? Date.now() - D.got : 0)), m = t.getHours() * 60 + t.getMinutes();
    const bizDow = m < 300 ? (t.getDay() + 6) % 7 : t.getDay();   // 5 点前算前一天的营业日
    const endM = bizDow === 5 || bizDow === 6 ? 285 : 30;
    const startM = t.getDay() === 6 ? 14 * 60 : 16 * 60 + 30;
    inHours = m >= startM + 20 || m <= endM;
    beforeStart = m > endM && m < startM + 20;

    + `<div class="svupdn">${arr[up] - cmp[up] > 0 ? `涨最多 <b class="dl up">${f(up)}</b>` : ''}${arr[dn] - cmp[dn] < 0 ? `　跌最多 <b class="dl dn">${f(dn)}</b>` : ''}</div>`;

// 一天的各店：店名＝[车站, 店名, 金额, 组, 客, 进店时段, 结账时段]

function svMissHtml(x) {

// 柱状图（最近 14 天／本月每天）：绿柱＝实际，灰柱＝预测，横线＝对比那天；点柱子看那天

  const x = svGet(svDay);
  h += `<div class="svcard"><div class="svct">${svYMD(svDay)}${svWkH(svDay)}${x && x.live ? (x.fin ? '<small>实时最终读数・12 点日报出来后以日报为准</small>' : '<small>实时・明天日报为准</small>') : ''}</div>`;
  if (!x) return h + `<div class="svnote">这一天没有数据${svDay < first ? '（营业额历史从 ' + first + ' 开始）' : (svDay >= svAdd(svToday(), -1) ? '（昨天的要等今天 12 点日报做完）' : '')}</div></div>`;
  const short = svShort(x);
  h += `<div class="svbig">${yen(x.t)}</div><div class="svnote">含税 · ${x.n} 家${short ? `　<span class="rr">${x.est ? `含 ${x.est.length} 家实时估计` : `少 ${short} 家`}</span>` : ''}${x.rest ? `　休息：${x.rest.map(r => esc(r[0] + ' ' + r[1].slice(0, 10))).join('、')}` : ''}</div>` + svMissHtml(x);
  if (!x.live || x.fin) {
    const lh = svLyHoli(svDay), lhx = lh && SV.map[lh];
    h += '<table class="svcmpt"><tr><th>对比</th><th>日期</th><th>营业额</th><th>增减</th></tr>' + ['lw', 'lm', 'ly'].map(k => { const d = svCmpDay(svDay, k), b = d && SV.map[d];
      return `<tr class="${k === svCmpM ? 'on' : ''}"><td>${SV_CMP[k]}</td><td>${d ? svYMD(d) + svWkH(d) : '—'}</td><td>${b ? man(b.t) : '没有数据'}</td><td>${b ? svDl(x.t, b.t) : ''}</td></tr>`; }).join('') + (lh ? `<tr><td>去年同一祝日</td><td>${svYMD(lh)}${svWkH(lh)}</td><td>${lhx ? man(lhx.t) : '没有数据'}</td><td>${lhx ? svDl(x.t, lhx.t) : ''}</td></tr>` : '') + '</table>';
    const b = (d => d && SV.map[d])(svCmpDay(svDay, svCmpM));
    if (x.g) h += `<div class="svmini"><div>组数<b>${x.g}</b>${b && b.g ? svDl(x.g, b.g) : ''}</div><div>客数<b>${x.c}</b>${b && b.c ? svDl(x.c, b.c) : ''}</div><div>客单价<b>${yen(x.c ? x.t / x.c : 0)}</b>${b && b.c && x.c ? svDl(x.t / x.c, b.t / b.c) : ''}</div></div>`
      + `<div class="svnote">组数・客数・客单价的增减是比${SV_CMP[svCmpM]}。</div>`;
  } else h += '<div class="svnote">今天还在营业，数字会一直涨；对比要等明天 12 点日报。</div>';
  h += `<div class="svlinks"><button onclick="svGo('hr')">⏰ 这天的时段</button><button onclick="svGo('st')">🏪 这天的各店</button></div></div>`;
  return h;
}

// ---- 时段 ----
function svTabHr(today) {

}

// ---- 各店 ----

  return h;
}

// ---- 预测（11/14 用户：要看到明年 12 月）----
const svMaxFcMon = today => (+today.slice(0, 4) + 1) + '-12';
// 11/14 回测（2026 年 10〜11 月，提前 0〜3 周预测的合计）：误差 +1%〜+9%，平均约 6%（偏多）。去年 12 月〜今年 3 月以前没有前年数据，12 月没法回测。
const svFcAcc = '回测（今年 10〜11 月）：误差约 +1〜+9%，平均 6%，偏多。12 月要等今年 12 月过完才能验证。';
function svTabFc(today) {
  const curMon = today.slice(0, 7), maxMon = svMaxFcMon(today);
  if (svMon < curMon || svMon > maxMon) svMon = curMon;
  const [y, m] = svMon.split('-').map(Number), nd = new Date(y, m, 0).getDate(), F = svMonthFc(y, m), M = svFModel();
  const lyMonSum = svMonAct(y - 1, m);
  let h = `<div class="svmon"><button class="iconbtn" onclick="svMove(-1)" ${svMon <= curMon ? 'disabled' : ''} aria-label="上个月">‹</button><b>${y} 年 ${m} 月</b><button class="iconbtn" onclick="svMove(1)" ${svMon >= maxMon ? 'disabled' : ''} aria-label="下个月">›</button></div>`;
  h += `<div class="svcard svhero"><div class="lab">${m} 月预测</div><div class="val">约 ${cnBig(F.t)}</div>`
    + `<div class="sub">${lyMonSum ? `去年 ${m} 月实际 ${cnBig(lyMonSum)}　${svDl(F.t, lyMonSum)}` : '去年同月没有完整数据'}</div></div>`;
  h += `<div class="svmini"><div>已到（${F.actN} 天）<b>${F.actN ? svOku(F.act) : '—'}</b></div><div>剩下（${F.n} 天）<b>约 ${svOku(F.rest)}</b></div><div>上半月／下半月<b>${svOku(F.half[0])}／${svOku(F.half[1])}</b></div></div>`;
  const list = []; for (let i = 1; i <= nd; i++) { const ds = svStr(new Date(y, m - 1, i)), x = ds < today && SV.map[ds]; list.push({ d: ds, v: x ? x.t : F.day[ds] || 0, f: !x }); }
  h += `<div class="svcard"><div class="svct">每天<small>点柱子看那天</small></div>${svColsChart(list, { label: false })}<div class="svlegend"><span><i></i>实际</span><span><i class="f"></i>预测</span></div></div>`;
  const far = svRefDay(svStr(new Date(y, m - 1, nd))) >= today;   // 去年同月还没到（明年的月份）
  h += `<div class="svcard"><div class="svct">怎么算的<small>每家店分开算再加起来</small></div><table class="svcmpt">`
    + (F.actN ? `<tr><td>已到 ${F.actN} 天（日报实际）${F.miss ? `<br><small>含缺店估计 ${cnBig(F.miss)}</small>` : ''}</td><td></td><td>${cnBig(F.act + F.miss)}</td><td></td></tr>` : '')
    + `<tr><td>老店 ${F.on} 家：${far ? '去年同月的预测' : '去年对应日子的营业额'}<br><small>${far ? '再 × 增减的一半' : '× 每家店自己的同店增减'}（全集团同店 ${svDl(M.G, 1)}）</small></td><td></td><td>${cnBig(F.ly)} → ${cnBig(F.o)}</td><td></td></tr>`
    + (F.nn ? `<tr><td>新店・去年这时没有数据的店 ${F.nn} 家<br><small>最近 4 周同星期几 × 老店的季节变化</small></td><td></td><td>${cnBig(F.nw)}</td><td></td></tr>` : '')
    + (Math.abs(F.adj) >= 1e5 ? `<tr><td>离今天近的日子<br><small>和最近 4 周的水平各一半（3 周内逐渐过渡）</small></td><td></td><td>${svWan(F.adj)}</td><td></td></tr>` : '')
    + `<tr class="on"><td>${m} 月预测</td><td></td><td>约 ${cnBig(F.t)}</td><td></td></tr></table>`
    + `<div class="svnote">去年对应日子＝同一周（1〜7/8〜14/15〜21/22 日〜）同一个星期几；祝日对祝日、祝日前一天对祝日前一天；12/24〜1/4 按日期对（忘年会・年末年始都在里面）。`
    + `同店增减＝最近 ${FC_WIN / 7} 周每家店比去年同期，数据少的店往全集团平均靠。已经关的店不算。${Object.keys(M.usedMon).length ? `去年 ${Object.keys(M.usedMon).sort().map(k => +k.slice(5) + ' 月').join('・')} 有的店收银台数据还没补到，先用云端月报的月合计（按那家店的星期几规律分到每天），补到后自动换成收银台数据。` : ''}${svFcAcc}</div></div>`;
  // 到明年 12 月每个月
  const ms = []; for (let k = 0; ; k++) { const t = new Date(+curMon.slice(0, 4), +curMon.slice(5, 7) - 1 + k, 1), mk = svStr(t).slice(0, 7); if (mk > maxMon) break;
    const yy = t.getFullYear(), mm = t.getMonth() + 1, f = svMonthFc(yy, mm), l = svMonAct(yy - 1, mm); ms.push({ mk, yy, mm, t: f.t, l, a: f.actN }); }
  const mx = Math.max(...ms.map(o => Math.max(o.t, o.l)));
  h += `<div class="svcard"><div class="svct">到 ${maxMon.slice(0, 4)} 年 12 月每个月<small>点一行看那个月</small></div><div class="svfcm">`
    + ms.map((o, i) => (i && o.yy !== ms[i - 1].yy ? `<p>${o.yy} 年</p>` : '') + `<button class="${o.mk === svMon ? 'on' : ''}" onclick="svMon='${o.mk}';renderSales();document.getElementById('salesView').scrollTop=0"><span>${o.mm} 月${o.a ? '<small>含实际</small>' : ''}</span>`
      + `<i><u style="width:${(100 * o.t / mx).toFixed(1)}%"></u>${o.l ? `<s style="left:${(100 * o.l / mx).toFixed(1)}%"></s>` : ''}</i><b>${svOku(o.t)}</b>${o.l ? svDl(o.t, o.l) : '<span class="dl">—</span>'}</button>`).join('')
    + `</div><div class="svlegend"><span><i class="f"></i>预测</span><span><s></s>去年同月实际</span></div>`;
  // 年合计（整年每天都有实际或预测才算）
  const yr = Y => { let t = 0; for (let mm = 1; mm <= 12; mm++) { const k = Y + '-' + String(mm).padStart(2, '0'); if (k > maxMon) return 0;
    if (k >= curMon) t += svMonthFc(Y, mm).t; else { const a = svMonAct(Y, mm); if (!a) return 0; t += a; } } return t; };
  const Y1 = +curMon.slice(0, 4), t1 = yr(Y1), t2 = yr(Y1 + 1), t0 = (() => { let t = 0; for (let mm = 1; mm <= 12; mm++) { const a = svMonAct(Y1 - 1, mm); if (!a) return 0; t += a; } return t; })();
  if (t2 || t1) h += `<div class="svmini">${t0 ? `<div>${Y1 - 1} 年实际<b>${svOku(t0)}</b></div>` : ''}${t1 ? `<div>${Y1} 年（实际＋预测）<b>${svOku(t1)}</b>${t0 ? svDl(t1, t0) : ''}</div>` : ''}${t2 ? `<div>${Y1 + 1} 年预测<b>${svOku(t2)}</b>${t1 ? svDl(t2, t1) : ''}</div>` : ''}</div>`;
  h += '</div>';
  return h;
}

// ===== 11/13 手机「🖥️ 让电脑重新登录」（只给老板）：手机发请求 → 云端（Code.gs what=relogin）→ 电脑 remote_login.py 每分钟查，
// 用电脑凭据管理器里保存的账号密码登录 レストランボード・Airレジ・预约副账号 → 结果写回，手机显示。密码不经过手机和云端。=====
let rlTimer = null;
function rlApi(act) { return fetch(API + '?fmt=json&what=relogin&k=' + encodeURIComponent(K) + (act ? '&act=' + act : ''), { cache: 'no-store' }).then(r => r.json()); }
const rlHm = s => s ? s.replace(/^\d{4}\/(\d+)\/(\d+)\s*/, '$1/$2 ').replace(/:\d{2}$/, '') : '—';
function rlShow(html) { document.getElementById('rlBody').innerHTML = html; }
function rlStatus(st) {
  const sm = st.seen && st.now ? Math.round((parseT(st.now) - parseT(st.seen)) / 60000) : null;
  return `<div class="rlst">电脑：${sm == null ? '还没连上过（电脑端小程序没在跑）' : sm <= 3 ? '🟢 在线' : '🔴 ' + sm + ' 分钟没回应（电脑可能关了或睡眠）'}</div>`
    + (st.done && st.result ? `<div class="rlres"><b>结果（${rlHm(st.done)}）</b><br>${esc(st.result).replace(/\n/g, '<br>')}</div>` : '');
}
function openRelogin() {
  if (!D || !D.owner) return;
  document.getElementById('rlView').style.display = 'flex';
  rlShow('读取中…');
  rlApi().then(st => {
    if (st.error) throw new Error(st.error === 'owner' ? '要用老板密码' : st.error);
    if (!('req' in st)) throw new Error('后台还没部署新版本');
    rlShow(rlStatus(st) + '<p class="rlnote">电脑会用自己保存的账号密码，重新登录レストランボード、Airレジ 和预约副账号（有楽町・川崎）。<b>密码改过的话，要先在电脑上双击「保存登录密码.bat」存新密码</b>，不然多点几次会把账号锁住。3 分钟内重复点只算一次。</p>'
      + '<button class="rlgo" onclick="rlGo()">🖥️ 让电脑现在重新登录</button>'
      + '<div class="rlpw"><b>🔐 密码改了？在这里输新密码</b>'
      + '<select id="rlSite" onchange="rlPick()"><option value="">— ① 先选要改哪个账号 —</option><option value="レストランボード">レストランボード 主账号（全部店的预约）</option><option value="RB川崎">预约副账号 川崎（稲ノ和 川崎店）</option><option value="RB有楽町">预约副账号 有楽町（稲ノ和 有楽町店）</option><option value="Airレジ">Airレジ（町田 2 家的收银）</option></select>'
      + '<input id="rlUser" name="rl_x1" placeholder="② AirID（先在 ① 选账号）" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">'
      + '<input id="rlPw" name="rl_x2" type="text" placeholder="③ 新密码（自己输，别点手机跳出来的自动填充）" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="-webkit-text-security:disc">'
      + '<div id="rlErr" class="rlerr"></div>'
      + '<button class="rlgo" id="rlPwBtn" onclick="rlSendPw()">🔐 加密发给电脑并登录</button>'
      + '<p class="rlnote">手机先用电脑的钥匙加密再发出去，云端只存密文、解不开；只有这台电脑能解开，存进电脑里（和「保存登录密码.bat」同一处）以后马上登录。<b>几个账号就发几次，每次先在 ① 选对账号</b>，发完等结果出来再发下一个。</p></div>');
  }).catch(e => rlShow('读不到：' + esc(e.message || e)));
}
// 11/13：手机输新密码 → 用电脑上传的公钥（RSA-OAEP）加密 → 云端只存密文 → 电脑 remote_login.py 解开存进凭据管理器、马上登录
// 11/13 晚：下拉框以前默认レストランボード，用户发副账号时没改，主账号被存成有楽町的 → 改成必须自己选，按钮上写清楚是哪个账号；发送中锁住按钮（以前连按会多发一个空密码）
// 11/14：手机的「自动填充密码」把上次记住的有楽町账号密码填进了 ②③，主账号・川崎都存成了有楽町的 →
//   副账号的 AirID 固定帮填好、对不上不让发；密码框不用 type=password（手机就不会自动填、不会记住）；发之前再确认一次
const RL_SUBID = { 'RB有楽町': 'hcl-yurakucho', 'RB川崎': 'hcl-kawasaki' };
const rlName = s => ({ 'レストランボード': 'レストランボード 主账号', 'RB有楽町': '预约副账号 有楽町', 'RB川崎': '预约副账号 川崎', 'Airレジ': 'Airレジ' })[s] || s;
function rlPick() {
  const sel = document.getElementById('rlSite'), b = document.getElementById('rlPwBtn'), u = document.getElementById('rlUser');
  b.textContent = sel.value ? '🔐 加密发给电脑：' + rlName(sel.value) : '🔐 加密发给电脑并登录';
  u.value = RL_SUBID[sel.value] || '';
  u.placeholder = sel.value === 'レストランボード' ? '② 主账号的 AirID（这次必填）' : sel.value === 'Airレジ' ? '② Airレジ 的 AirID（没改就不用填）' : '② AirID';
  document.getElementById('rlPw').value = ''; document.getElementById('rlErr').textContent = '';
}
function rlCheck(site, u) {   // 和电脑 remote_login.id_mismatch 一样的检查
  const ul = u.toLowerCase(), kw = { 'RB有楽町': 'yurakucho', 'RB川崎': 'kawasaki' }[site];
  if (kw && !ul.includes(kw)) return `② AirID 不对：${rlName(site)} 的 AirID 是 ${RL_SUBID[site]}`;
  if (site === 'レストランボード') {
    if (!u) return '② 主账号的 AirID 这次要填（电脑里主账号的 AirID 被存成了有楽町的）';
    if (/yurakucho|kawasaki/.test(ul)) return '② 这是副账号的 AirID，主账号要填主账号自己的 AirID';
  }
  return '';
}
let rlSending = false;
async function rlSendPw() {
  const err = m => { const e = document.getElementById('rlErr'); if (e) e.textContent = m; else rlShow('<div class="rlerr">' + esc(m) + '</div><button class="rlgo" onclick="openRelogin()">返回</button>'); };
  if (rlSending) return;
  const site = document.getElementById('rlSite').value, u = document.getElementById('rlUser').value.trim(), pwEl = document.getElementById('rlPw');
  if (!site) { err('请先在 ① 选要改哪个账号'); return; }
  const bad = rlCheck(site, u);
  if (bad) { err(bad); return; }
  if (!pwEl.value) { err('请输入新密码'); return; }
  if (!confirm(`发给电脑：${rlName(site)}\nAirID：${u || '（不改，用电脑里存的）'}\n新密码：${pwEl.value.length} 位\n\n账号、AirID、密码位数都对吗？`)) return;
  const pwv = pwEl.value; pwEl.value = ''; rlSending = true; document.getElementById('rlPwBtn').disabled = true;
  try {
    if (!(window.crypto && crypto.subtle)) throw new Error('这个浏览器不能加密，换 Safari 或 Chrome 打开');
    const st = await rlApi();
    if (!st.pub) throw new Error('电脑还没准备好（电脑端小程序没在跑），过几分钟再试');
    const key = await crypto.subtle.importKey('jwk', JSON.parse(st.pub), { name: 'RSA-OAEP', hash: 'SHA-1' }, false, ['encrypt']);
    const data = new TextEncoder().encode(JSON.stringify({ s: site, u, p: pwv }));
    if (data.length > 200) throw new Error('AirID 或密码太长');
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, key, data));
    let bin = ''; ct.forEach(b => bin += String.fromCharCode(b));
    rlShow('🔐 加密好了，发送中…');
    const r = await fetch(API + '?fmt=json&what=relogin&k=' + encodeURIComponent(K) + '&act=setpw&ct=' + encodeURIComponent(btoa(bin)), { cache: 'no-store' }).then(x => x.json());
    if (r.error) throw new Error(r.error);
    rlWait(r.req);
  } catch (e) { err('没发出去：' + (e.message || e)); }
  finally { rlSending = false; const b = document.getElementById('rlPwBtn'); if (b) b.disabled = false; }
}
function rlGo() {
  rlShow('发送中…');
  rlApi('req').then(st => rlWait(st.req)).catch(e => rlShow('没发出去：' + esc(e.message || e)));
}
function rlWait(req) {
  clearInterval(rlTimer); let n = 0;
  const tick = () => rlApi().then(st => {
    n++;
    if (st.done && st.done >= req) { clearInterval(rlTimer); rlShow(rlStatus(st) + '<button class="rlgo" onclick="closeRelogin();load(true)">好了，刷新</button>'); return; }
    rlShow(`<div class="rlst">⏳ 已发给电脑（${rlHm(req)}）。${st.take && st.take >= req ? '电脑正在登录，约 1〜2 分钟…' : '电脑每分钟查一次，最多 1 分钟内开始…'}</div><small>已等 ${n * 10} 秒</small>` + rlStatus(Object.assign({}, st, { done: '' })));
    if (n >= 60) { clearInterval(rlTimer); rlShow('10 分钟还没有结果，电脑可能没开或睡眠了。' + rlStatus(st)); }
  }).catch(() => {});
  tick(); rlTimer = setInterval(tick, 10000);
}
function closeRelogin() { clearInterval(rlTimer); document.getElementById('rlView').style.display = 'none'; }
function card(s) {
  const isOpen = isOpenS(s.label), fav = favs.includes(s.label);
  const pct = s.n ? s.free / s.n : 0, cls = pct >= 0.5 ? 'g' : pct >= 0.2 ? 'm' : 'rr';
  const L = esc(JSON.stringify(s.label));
  const cnt = k => s.tables.filter(t => t.s === k).length;
  let big, sub = '', best = '', badges = '', seg = '', warnFull = '';
  const yen = s.sales ? '　<span class="yen">' + esc(s.sales) + '</span>' : '';
  if (s.status === 'closed') { big = '<small>🌙 已打烊</small>'; sub = esc(s.note) + yen; }
  else if (s.status === 'air') { big = '<small>—</small>'; sub = esc(s.note) + yen; }
  else if (!s.n) { big = '<small class="r">' + (/抓取失败/.test(s.warn) ? '⚠ 这轮没读到' : '没有桌位数据') + '</small>'; sub = s.warn ? '<span class="r">' + esc(s.warn) + '</span>（下一轮会再读）' : ''; }
  else {
    big = `<b class="${cls}">${s.free}</b><small>空 / ${s.n} 桌</small>`;
    sub = [s.ppl != null ? '在店 ' + s.ppl + ' 人' : '', '使用中 ' + s.busy, s.sales ? '<span class="yen">' + esc(s.sales) + '</span>' : ''].filter(Boolean).join('　');
    const w = k => (k / s.n * 100).toFixed(2) + '%';
    seg = `<div class="seg"><i style="width:${w(s.free)};background:var(--free)"></i><i style="width:${w(s.held)};background:var(--held)"></i><i style="width:${w(cnt('over'))};background:var(--over)"></i><i style="width:${w(cnt('lo'))};background:var(--lo)"></i><i style="width:${w(cnt('remind'))};background:var(--remind)"></i></div>`;
    badges = [['held', s.held, '🟦 留桌'], ['over', cnt('over'), '放题超时'], ['lo', cnt('lo'), 'L.O.'], ['remind', cnt('remind'), '快结束']]
      .filter(x => x[1]).map(([c, k, t]) => `<span class="bd ${c}">${t} ${k}</span>`).join('');
    const b = s.info.find(x => /^②/.test(x));
    if (b) {
      // ② 后面常接一长段「⚠ 1 小时内的预约还有…没点来店」，卡片上只留一行，全文放到展开后
      const [main, ...rest] = b.replace(/^②\s*最早有位：/, '').split(/；(?=⚠)/);
      best = `<div class="best">⏱ <b>最早有位</b>　${esc(main)}</div>`;
      if (rest.length) {
        const wn = rest.join('；'), m = wn.match(/还有\s*(\d+)\s*组\s*(\d+)\s*人/);
        best += `<div class="best wn">${m ? `⚠ 1 小时内有 ${m[1]} 组 ${m[2]} 人预约还没点来店` : esc(wn.slice(0, 40) + '…')}</div>`;
        if (isOpen) warnFull = `<div class="best wn">${esc(wn)}</div>`;
      }
    }
    // 预约：这桌有人、下一组 30 分内要到；没排桌的预约 30 分内要到几组
    const clashN = s.tables.filter(t => clashOf(s, t)).length;
    if (clashN) badges += `<span class="bd over">⚠ 下一组快到、桌还没空 ${clashN}</span>`;
    const sn = soon(s);
    if (sn.length) best += `<div class="best ${sn.length > s.free ? 'wn' : 'sn'}">📅 30 分内要到 ${sn.length} 组 ${sn.reduce((a, r) => a + r.ppl, 0)} 人（没排桌）　现在空 ${s.free} 桌</div>`;
  }
  let body = '';
  if (isOpen) body = warnFull + detail(s);
  const canOpen = s.tables.length || s.info.length || s.pending.length || s.notes.length;
  return `<div class="card${s.status !== 'open' ? ' closed' : ''}">
    <div class="hd" onclick="toggleOpen(${L})">
      <button class="star${fav ? ' on' : ''}" onclick="toggleFav(event, ${L})" aria-label="设为我的店">${fav ? '★' : '☆'}</button>
      <div class="nm"><div class="area"><span class="stn">${esc(s.area)}</span></div><div class="sn">${esc(s.name)}</div>
        <div class="area">${sub}</div>${badges ? '<div class="badges">' + badges + '</div>' : ''}${seg}</div>
      <div class="big">${big}</div>
    </div>
    ${best}
    ${!isOpen && s.tables.length ? mini(s, L) : ''}
    ${isOpen ? '<div class="body">' + body + '</div>' : ''}
    ${canOpen ? `<button class="more" onclick="toggleOpen(${L})">${isOpen ? '收起 ▲' : '看桌位图 ▼'}</button>` : ''}
  </div>`;
}

// 卡片上的小桌位图：不用点开就能看到哪几桌空（点一下展开详细）
function mini(s, L) {
  return `<div class="mini" onclick="toggleOpen(${L})">` + s.tables.map(t =>
    `<i class="${t.s}${clashOf(s, t) ? ' cl' : ''}">${esc(String(t.t).replace(/（.*$/, ''))}</i>`).join('') + '</div>';
}

let curStore = null;  // tile() 要知道是哪家店（看这桌的下一组预约）
function detail(s) {
  curStore = s;
  const L = esc(JSON.stringify(s.label));
  const f = tileF[s.label] || 'all';
  const groups = { all: () => true, free: t => t.s === 'free', used: t => t.s !== 'free' && t.s !== 'held', held: t => t.s === 'held', alert: t => ['remind', 'lo', 'over'].includes(t.s) };
  const names = { all: '全部', free: '空桌', used: '使用中', held: '留桌', alert: '放题要注意' };
  let h = '';
  if (s.warn) h += `<div class="note warn">${esc(s.warn)}</div>`;
  if (s.tables.length) {
    h += '<div class="filters">' + Object.keys(groups).map(k => {
      const c = s.tables.filter(groups[k]).length;
      return (k === 'all' || c) ? `<button class="chip${f === k ? ' on' : ''}" onclick='setTileF(${L},"${k}")'>${names[k]} ${c}</button>` : '';
    }).join('') + '</div>';
    h += '<div class="tiles">' + s.tables.map(t => tile(t, groups[f](t))).join('') + '</div>';
  }
  // ③ 空位时间 → 时间线
  const third = s.info.find(x => /^③/.test(x));
  if (third) {
    const items = third.replace(/^③[^：]*：/, '').split('｜').map(x => x.trim()).filter(Boolean);
    if (items.length) {
      h += '<h3>什么时候会空出来（早→迟）</h3><div class="tl">' + items.map(x => {
        const m = x.match(/^(现在～预约前|现在|快空[^）]*）|\d{1,2}:\d{2}|时间不明[^）]*）)\s*(.*)$/);
        const label = m ? m[1].replace(/（.*$/, '') : '';
        const rest = m ? m[2] : x;
        return `<div class="${/^现在/.test(label) ? 'now' : ''}"><b>${esc(label || '')}</b> ${esc(rest)}</div>`;
      }).join('') + '</div>';
    }
  }
  s.notes.forEach(x => h += `<div class="note${/⚠/.test(x) ? ' warn' : ''}">${esc(x)}</div>`);
  if (s.rsv) h += ledger(s);
  else if (s.pending.length) h += '<h3>还没分配到桌的预约</h3><div class="pend">' + s.pending.map(p => `<div>${p.map(esc).join('　')}</div>`).join('') + '</div>';
  return h;
}

// ---------- 预约（11/12）：今日预约清单、每桌下一组、「下一组快到了这桌还没空」 ----------
// 营业到半夜：5 点前的时间算前一天的延续（+24 小时）
const toM = hm => { const m = String(hm || '').match(/(\d{1,2}):(\d{2})/); if (!m) return null; const v = +m[1] * 60 + +m[2]; return +m[1] < 5 ? v + 1440 : v; };
const nowM = () => { const v = nowMin(); return v == null ? null : (v < 300 ? v + 1440 : v); };
const rbM = () => { const m = String(D.rbStamp || '').match(/\s(\d{1,2}:\d{2})/); return m ? toM(m[1]) : null; };
const isWait = r => /来店待/.test(r.status);
const isIn = r => /来店済/.test(r.status);
const isGone = r => /会計済|退店/.test(r.status);
// 桌号统一成数字：PE「11（4人桌）」「カウンター13」→ 11、13；レストランボード「テーブル席51+テーブル席52」「1卓（テ・個）※…」→ 51、52、1
const numOf = s => { const m = String(s || '').replace(/（.*$/, '').replace(/※.*$/, '').match(/(\d+)/); return m ? String(+m[1]) : null; };
// 「個室9」「半個室」「6名~」这种和 PE 桌号对不准，不硬对（只在预约清单里显示原文）
const rbNums = tbl => String(tbl || '').split(/[+＋,，、・\/]/).filter(p => !/個室|名/.test(p)).map(numOf).filter(Boolean);
// 某桌接下来还没到的预约（开始前 / 开始后 60 分内）
function nextFor(s, t) {
  if (!s.rsv) return null;
  const n = numOf(t.t), now = nowM();
  if (!n || now == null) return null;
  return s.rsv.filter(r => isWait(r) && rbNums(r.tbl).includes(n) && toM(r.st) >= now - 60)
    .sort((a, b) => toM(a.st) - toM(b.st))[0] || null;
}
// 这桌有人在坐，下一组 30 分内要到（或已过点）→ 提醒
function clashOf(s, t) {
  if (t.s === 'free' || t.s === 'held') return null;
  const r = nextFor(s, t), now = nowM();
  if (!r) return null;
  const d = toM(r.st) - now;
  return d <= 30 ? { r, d } : null;
}
// 30 分内要到、还没排桌的预约
function soon(s) {
  const now = nowM();
  if (!s.rsv || now == null) return [];
  return s.rsv.filter(r => isWait(r) && !r.tbl && toM(r.st) >= now - 15 && toM(r.st) <= now + 30);
}
function rsvChip(r) {
  if (isIn(r)) return '<span class="rc in">已到</span>';
  if (isGone(r)) return '<span class="rc gone">已走</span>';
  if (!isWait(r)) return `<span class="rc">${esc(r.status || '—')}</span>`;
  const now = nowM(), st = toM(r.st), rb = rbM();
  if (now == null || st == null) return '<span class="rc">未到</span>';
  if (now < st) return `<span class="rc">${st - now} 分后</span>`;
  // 预约状态是 レストランボード 上次读到的；开始时间比那次还晚，就还不知道到没到
  if (rb != null && st > rb) return '<span class="rc">状态待更新</span>';
  const late = now - st;
  return `<span class="rc ${late > 15 ? 'late2' : late >= 5 ? 'late1' : ''}">${late < 5 ? '刚到点' : '迟到 ' + late + ' 分'}</span>`;
}
function ledger(s) {
  const list = s.rsv.slice().sort((a, b) => toM(a.st) - toM(b.st));
  if (!list.length) return '<h3>今日预约</h3><div class="note">今天没有 レストランボード 的预约</div>';
  const ppl = list.reduce((a, r) => a + r.ppl, 0), wait = list.filter(isWait).length;
  const hm = (String(D.rbStamp || '').match(/\s(\d{1,2}:\d{2})/) || [])[1] || '?';
  return `<h3>今日预约　${list.length} 组 ${ppl} 人<small>　未到 ${wait} 组 · 状态是 ${esc(hm)} 读到的</small></h3><div class="ldg">` +
    list.map(r => `<div class="${isGone(r) ? 'gone' : ''}"><span class="lt">${esc(r.st)}</span><span class="ln"><b>${esc(r.name)} 様</b> ${r.ppl}名<br><small>${r.tbl ? '🪑 ' + esc(r.tbl) : '没排桌'}${r.course ? '　' + esc(r.course) : ''}</small></span>${rsvChip(r)}</div>`).join('') + '</div>';
}

function tile(t, show) {
  const S = curStore;
  const nx = S ? nextFor(S, t) : null, cl = S ? clashOf(S, t) : null;
  const se = t.s === 'free' || t.s === 'held' ? null : seat(t);
  let line = '';
  if (t.s === 'free') line = '';
  else if (se) line = esc(se.ppl) + '人 · ' + fmtMin(se.mins);
  const rest = t.x.filter(x => !/开台$/.test(x));
  // 坐了多久：底部细条，90 分满格
  const bar = se && se.mins != null ? `<i class="tm" style="width:${Math.min(100, se.mins / 90 * 100)}%;color:${se.mins >= 120 ? 'var(--over)' : se.mins >= 90 ? 'var(--remind)' : 'var(--used)'}"></i>` : '';
  const nxt = nx && t.s !== 'held' ? `<div class="nx${cl ? ' cl' : ''}">${cl ? '⚠ ' + (cl.d >= 0 ? cl.d + ' 分后' : '已过 ' + (-cl.d) + ' 分') + '下一组到，还没空<br>' : '📅 下一组 '}${esc(nx.st)} ${nx.ppl}名 ${esc(nx.name)}</div>` : '';
  return `<div class="tile ${t.s}${show ? '' : ' dim'}${cl ? ' clash' : ''}" onclick="toggleTile(event)">
    <b>${esc(t.t)}</b><div class="st">${ST[t.s]}${line ? '<span style="font-weight:400;color:var(--ink)"> ' + line + '</span>' : ''}</div>
    ${nxt}${rest.length ? `<div class="x">${rest.map(esc).join('<br>')}</div>` : ''}${bar}</div>`;
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
// 11/13 自动换新版：手机 APP 从后台切回来不会重新载入网页，改版就一直看不到。
// 打开 / 切回来时看 sw.js 里的版本号，和这一页的 APPV 不一样就重新载入一次（同一版本只重载一次，防止死循环）。
// 改版时 sw.js 的 V 和这里的 APPV 要一起改。
function checkUpdate() {
  fetch('sw.js', { cache: 'no-store' }).then(r => r.text()).then(t => {
    const v = (t.match(/kongzhuo-v\d+/) || [])[0];
    if (!v || v === APPV || LS.get('reloadFor', '') === v) return;
    LS.set('reloadFor', v);
    const reg = navigator.serviceWorker && navigator.serviceWorker.getRegistration ? navigator.serviceWorker.getRegistration() : Promise.resolve(null);
    reg.then(r => r && r.update()).catch(() => {}).then(() => location.reload());
  }).catch(() => {});
}
document.getElementById('nav').style.display = 'flex';
load();
checkUpdate();
// 11/14：APP 在后台（看不见）时不读不画；营业额页开着时不重画底下的首页（省电、不卡）
setInterval(() => { if (!document.hidden) load(); }, 60000);
setInterval(() => { if (D && !document.hidden && !svOpen()) renderSoon(); }, 30000);  // 「几分前」「坐了多久」跟着走
setInterval(checkUpdate, 30 * 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (K) load(); checkUpdate(); } });
</script>
