<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>会计部</title>
<meta name="theme-color" content="#6d28d9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="会计部">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#16181d;--sub:#6b7280;--line:#e5e7eb;--soft:#f0f1f4;--brand:#6d28d9;--warnbg:#fef3c7;--warn:#78350f;--ok:#15803d;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--ink:#eceef2;--sub:#9aa1ad;--line:#2a2e36;--soft:#22262e;--brand:#8b5cf6;--warnbg:#3a2f12;--warn:#fde68a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.top h1{flex:1;margin:0;font-size:22px}
.top small{color:var(--sub);font-size:12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;position:sticky;top:0;z-index:2;background:var(--bg);padding:4px 0 10px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;padding-left:10px!important;padding-right:10px!important;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 12px;font-size:14.5px;font-weight:600}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.ct{font-weight:700;font-size:15.5px;margin-bottom:4px}
.note{font-size:13px;color:var(--sub);line-height:1.65;margin:4px 0}
.miss{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:13.5px;line-height:1.6;margin:6px 0}
.btn{display:block;width:100%;margin-top:10px;padding:12px;border:0;border-radius:12px;background:var(--brand);color:#fff;font:inherit;font-size:15px;font-weight:600}
.btn.sub{background:var(--soft);color:var(--ink);font-weight:500}
.btn:disabled{opacity:.5}
input,textarea{display:block;width:100%;margin-top:8px;padding:10px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
textarea{min-height:120px;resize:vertical}
.msg{border-top:1px solid var(--line);padding:9px 0}
.msg:first-child{border-top:0}
.msg small{display:block;color:var(--sub);font-size:12px}
.msg div{white-space:pre-wrap;word-break:break-word}
.ok{color:var(--ok);font-size:13.5px;margin-top:8px}
.err{color:var(--bad);font-size:13.5px;margin-top:8px}
.foot{font-size:12px;color:var(--sub);text-align:center;margin-top:16px;line-height:1.7}
.foot a{color:var(--brand);cursor:pointer}
#keybox{display:none;text-align:center;padding:40px 8px}
#keybox img{width:72px;height:72px;border-radius:18px}
#keybox input{max-width:260px;margin:12px auto 0;text-align:center}
#keybox .btn{max-width:260px;margin:12px auto 0}

/* 11/19 📋 事项汇报 */
.seg2{display:flex;gap:6px;margin:0 0 6px}.seg2 button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px;font:inherit;font-weight:600}.seg2 button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px}.who button{padding:16px 6px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:17px;font-weight:700}
.me{display:flex;align-items:center;gap:8px;margin:2px 0 4px;font-size:15px}.me b{font-size:18px}.me a{color:var(--brand);cursor:pointer;font-size:13.5px}
.grp{font-size:13.5px;color:var(--sub);font-weight:700;margin:14px 2px 4px}
.it{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.it.late{border:2px solid var(--bad)}.it.done{opacity:.75}
.it .nm{font-weight:700;font-size:15.5px;line-height:1.45}.it .dl{font-size:12.5px;color:var(--sub);margin-top:2px}.it .dl b{color:var(--bad)}
.it .now{font-size:13px;margin-top:4px}.it .now .bad{color:var(--bad);font-weight:700}
.bt3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}.bt3 button{padding:12px 4px;border:0;border-radius:10px;font:inherit;font-size:15.5px;font-weight:700;color:#fff}
.bt3 .b1{background:#16a34a}.bt3 .b2{background:#d97706}.bt3 .b3{background:#dc2626}.bt3 button.cur{outline:3px solid var(--ink);outline-offset:1px}.bt3 button:disabled{opacity:.5}
.stk{margin-top:8px}.stk input{margin-top:0}.stk .btn{margin-top:6px;background:#dc2626}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px}.p1{background:#dcfce7;color:#166534}.p2{background:#fef3c7;color:#92400e}.p3{background:#fee2e2;color:#991b1b}.p0{background:var(--soft);color:var(--sub)}
.kp{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}.kp div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}.kp b{display:block;font-size:22px;line-height:1.2}.kp small{font-size:12px;color:var(--sub)}.kp .r b{color:var(--bad)}
.row{border-top:1px solid var(--line);padding:8px 0;font-size:14px;line-height:1.5}.row:first-of-type{border-top:0}.row small{color:var(--sub)}.row .kd{color:var(--bad);font-weight:600}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--brand)}
.fm label{display:block;font-size:13px;color:var(--sub);margin-top:10px}.fm select{display:block;width:100%;margin-top:4px;padding:10px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}.fm input{margin-top:4px}
.testbar{position:sticky;top:0;z-index:9;background:#facc15;color:#422006;font-size:13.5px;font-weight:700;text-align:center;padding:calc(7px + env(safe-area-inset-top)) 8px 7px}.testbar a{color:#422006;text-decoration:underline}
.det{background:var(--soft);border-radius:10px;padding:8px 10px;margin:6px 0 2px}.det table{width:100%;border-collapse:collapse;font-size:13.5px}.det th,.det td{text-align:left;padding:4px 4px;border-top:1px solid var(--line);vertical-align:top;white-space:normal}.det tr:first-child th,.det tr:first-child td{border-top:0}.det th{width:7.5em;color:var(--sub);font-weight:600;white-space:nowrap}.det td{word-break:break-all}
.fm .ck{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:15px}.fm .ck input{width:auto;margin:0}
/* 11/24 🎫 积分对账 */
.ptm{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px;table-layout:fixed}.ptm th{text-align:left;color:var(--sub);font-weight:600;padding:4px 2px}.ptm th:first-child{width:28%}
.ptm td{border-top:1px solid var(--line);padding:5px 2px;vertical-align:top}.ptm td small{display:block;font-size:11.5px;color:var(--sub)}.ptm tr{cursor:pointer}.ptm tr.on td{background:var(--soft)}
.sq{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid #aaa;vertical-align:-1px;margin:0 2px}.sq.g{background:#C4EDCD}.sq.w{background:#fff}.sq.r{background:#FFCCCC}.bbt{font-size:12.5px}.bbt th:first-child{width:19%}.bbt th:nth-child(2){width:11%}.bbt td{padding:5px 1px}.ptm td.bad b{color:var(--bad)}.ptm td.okc b{color:var(--ok)}
.pt3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}.pt3 div{background:var(--soft);border-radius:10px;padding:6px 8px}.pt3 small{display:block;font-size:12px;color:var(--sub)}.pt3 b{font-size:16px}
.ptsg{display:grid;grid-template-columns:1fr;gap:6px;margin-top:8px}.ptsg select{width:100%;padding:10px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}.ptsg input{margin:0}.ptsg button{border:0;border-radius:10px;background:var(--ok);color:#fff;font:inherit;font-weight:700;padding:11px}
/* 11/24 🔎 成本异常 */
.it.cr{border-left:5px solid var(--bad)}.it.cyy{border-left:5px solid #d97706}.it.sg{border-left:5px solid var(--ok);opacity:.8}
.it .why{font-size:13.5px;color:var(--sub);margin-top:4px;line-height:1.55}.it .fix{font-size:13.5px;margin-top:2px;line-height:1.55}
.cysg{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:8px}.cysg input{margin:0}.cysg button{border:0;border-radius:10px;background:var(--ok);color:#fff;font:inherit;font-weight:700;padding:0 12px}
.sgd{font-size:13.5px;color:var(--ok);margin-top:6px}.sgd a{color:var(--sub);margin-left:8px;cursor:pointer;font-size:12.5px}
.an{margin:0;padding-left:18px}.an li{margin:4px 0;font-size:14px;line-height:1.65}
.nw{display:inline-block;font-size:11px;font-weight:700;background:var(--bad);color:#fff;border-radius:6px;padding:0 5px;margin-left:4px;vertical-align:1px}
</style>
</head>
<body>
<div class="wrap">
  <div id="keybox">
    <img src="icon-192.png" alt="">
    <p id="ktip">会计部 APP<br>请输入负责人给的密码</p>
    <input id="kin" autocomplete="off" autocapitalize="off" enterkeyhint="go" onkeydown="if(event.key==='Enter')saveKey()">
    <button class="btn" id="kgo" onclick="saveKey()">开始使用</button>
    <button class="btn sub" id="kretry" style="display:none" onclick="load()">重新试一次</button>
    <p id="kerr" class="err"></p>
  </div>
  <div id="main" style="display:none">
    <div class="top"><a id="kzback" href="./" style="display:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:14px;color:var(--ink);text-decoration:none">‹ 空桌一览</a><h1>🧾 会计部</h1><small id="age"></small></div>
    <div class="tabs" id="tabs"></div>
    <div id="body"></div>
    <div class="foot" id="foot"></div>
  </div>
</div>
<script>
// 11/18 用户：「单独的会计部键这个 APP 也做出来，因为给会计部看，然后让他们说有什么想更新的」。
// 数据接口和「空桌一览」同一个后台（Apps Script）；会计部密码（或老板密码）才看得到。只有登记过的手机能用（手机编号 dv）。
const API = 'https://script.google.com/macros/s/AKfycbxDX1OB8iAKYYpfBlncpfov66qsDdWfq6wjs2xNGydXDbkkUPf7NsOwwmd_PG2Dbpe0/exec';
const APPV = 'kuaiji-v23';
// 11/19 自检：提需求「测试版 → 老板确认 → 正式版」流程跑通（这一行就是自检时上线的改动）
const TEST = /\/test\//.test(location.pathname);
const IN_KZ = /\/kongzhuo\//.test(location.pathname);   // 11/19 用户：「会计部跟运营部一样，不是 2 个网页」→ 空桌一览「🧾 会计」打开的是这份网页的副本 kongzhuo/kj.html（内容完全一样）   // 11/19 测试版（kuaiji/test/）：Claude 按需求改好先放这里，老板确认后才换成正式版   // 版本号：和 sw.js 的 V 一起改
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const jq = s => esc(JSON.stringify(String(s == null ? '' : s)));   // 11/24 安全：数据放进按钮点击代码一律用 ${jq(x)}，不要写 '${x}'（esc 防不了代码里的引号）
let K = LS.get('k', '');
const fromUrl = (location.hash.match(/k=([^&]+)/) || [])[1];
if (fromUrl) { K = decodeURIComponent(fromUrl); LS.set('k', K); history.replaceState(null, '', location.pathname); }
const DV = (() => { let v = LS.get('dv', ''); if (!/^[0-9a-f]{32}$/.test(v)) { const a = new Uint8Array(16); crypto.getRandomValues(a); v = Array.from(a, b => b.toString(16).padStart(2, '0')).join(''); LS.set('dv', v); } return v; })();
const DVUA = (() => { const u = navigator.userAgent, st = (navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)) ? '主屏幕APP' : '浏览器'; let m;
  if ((m = u.match(/iPhone OS ([\d_]+)/))) return `iPhone iOS ${m[1].replace(/_/g, '.')}・${st}${IN_KZ ? '' : '・会计部APP'}`;
  if ((m = u.match(/iPad.*? OS ([\d_]+)/))) return `iPad iOS ${m[1].replace(/_/g, '.')}・${st}${IN_KZ ? '' : '・会计部APP'}`;
  if ((m = u.match(/Android ([\d.]+); ([^;)]+)/))) return `Android ${m[1]} ${m[2].trim()}・${st}${IN_KZ ? '' : '・会计部APP'}`;
  return `${(u.match(/Windows NT|Macintosh|Android|Linux/) || ['其他'])[0]}・${st}${IN_KZ ? '' : '・会计部APP'}`; })();
// 11/19 老板在空桌一览「📱 登录手机」点「👀 会计部画面」→ 在 kj.html 里按会计部密码的权限看（后台第 27 版 as=ac），顶上黄条「回到老板画面」
const PVAC = IN_KZ && LS.get('asRole', '') === 'ac';
function exitPreview() { ['asRole', 'asStaff', 'last', 'acrq'].forEach(k => { try { localStorage.removeItem(k); } catch (e) {} }); location.href = './'; }
const api = q => fetch(API + '?fmt=json' + q + '&k=' + encodeURIComponent(K) + '&dv=' + DV + '&ua=' + encodeURIComponent(DVUA) + (PVAC ? '&as=ac' : ''), { cache: 'no-store' }).then(r => r.json());

const TABS = [['sx', '📋 事项汇报'], ['ns', '💴 取消料'], ['cy', '🔎 当月预估表异常'], ['pt', '🎫 积分对账'], ['bb', '🎁 BB 费用'], ['msg', '💡 提需求'], ['cash', '资金余额'], ['pay', '要付的钱'], ['pl', '月度损益']];   // 11/19 用户：「没有提需求这个键」——第 5 个在手机上被挤到右边看不见 → 放第 2 个，标签换行全部看得到
const INFO = {
  cash: ['各公司银行・现金余额，这个月进了多少、出了多少。', 'Google Drive「11家流水」整理出来的现金流（残高）表。'],
  pay: ['请求书・信用卡要付的钱：哪天付、付多少，快到期的标出来。', '公司档案里的请求书、信用卡明细。'],
  pl: ['每家店每个月：营业额 − 工资 − 食材酒水 − 房租等，看赚多少。', '营业额＝收银台日报；工资＝工资表；食材酒水・房租等＝freee 记账。'],
};
let tab = LS.get('acTab', 'sx'), AC = null, sendMsg = '', draft = '';
if (!TABS.some(t => t[0] === tab) || (tab === 'cash' && !LS.get('sxSeen', ''))) tab = 'sx';   // 11/19：事项汇报做好后第一次打开先看它
LS.set('sxSeen', '1');

function showKey(msg, blocked) {
  $('main').style.display = 'none'; $('keybox').style.display = 'block';
  $('kin').style.display = $('kgo').style.display = blocked ? 'none' : '';
  $('kretry').style.display = blocked ? '' : 'none';
  if (!blocked) $('ktip').innerHTML = '会计部 APP<br>请输入负责人给的密码';
  $('kerr').textContent = msg || '';
}
function saveKey() { const v = $('kin').value.trim(); if (!v) return; K = v; LS.set('k', K); load(); }
function changeKey() { LS.del('k'); K = ''; LS.del('acc'); AC = null; showKey(''); }
async function load() {
  if (!K) return showKey('');
  if (!AC) { try { AC = JSON.parse(LS.get('acc', 'null')); } catch (e) {} if (AC) render(); }
  try {
    const d = await api('&what=ac');
    if (d.error === 'key') { LS.del('k'); K = ''; return showKey('密码不对，请再确认一下'); }
    if (d.error === 'device') {   // 没登记的手机：不显示任何东西，手机里存的也删掉
      LS.del('acc'); AC = null;
      $('ktip').innerHTML = `🔒 这台手机还没登记，不能使用。<br>已经通知负责人。<br>手机编号：<b>${esc(d.id || '—')}</b><br><small>请负责人在「空桌一览 › 📱 登录手机」里开放登记，然后按下面的「重新试一次」。</small>`;
      return showKey('', true);
    }
    if (d.error === 'owner') { LS.del('k'); K = ''; return showKey('这个密码看不到会计部，请用会计部密码'); }
    if (d.error) throw new Error(d.error);
    AC = d; LS.set('acc', JSON.stringify(d));
  } catch (e) { if (!AC) return showKey('读不到（' + e.message + '），等一下再试'); }
  render();
  if (tab === 'sx') loadSx();
  if (tab === 'msg') loadRq();
  if (tab === 'ns') loadNs();
  if (tab === 'cy') loadCy();
  if (tab === 'pt' || tab === 'bb') loadPt();
}
function go(t) { tab = t; LS.set('acTab', t); sendMsg = ''; render(); window.scrollTo(0, 0); if (t === 'sx') loadSx(); if (t === 'msg') loadRq(); if (t === 'ns') loadNs(); if (t === 'cy') loadCy(); if (t === 'pt' || t === 'bb') loadPt(); }
function ask(t) { const nm = TABS.find(x => x[0] === t)[1]; draft = `【${nm}】`; go('msg'); setTimeout(() => { const e = $('mv'); if (e) { e.focus(); e.setSelectionRange(e.value.length, e.value.length); } }, 50); }
function render() {
  $('keybox').style.display = 'none'; $('main').style.display = 'block';
  $('age').textContent = AC && AC.now ? AC.now.slice(5) + ' 更新' : '';
  $('tabs').innerHTML = TABS.map(([k, n]) => `<button class="${tab === k ? 'on' : ''}" onclick="go(${jq(k)})">${n}</button>`).join('');
  let h = '';
  if (tab === 'sx') h += renderSx();
  else if (tab === 'msg') h += renderRq();
  else if (tab === 'ns') h += renderNs();
  else if (tab === 'cy') h += renderCy();
  else if (tab === 'pt') h += renderPt();
  else if (tab === 'bb') h += renderBb();
  else {
    const nm = TABS.find(x => x[0] === tab)[1], [what, src] = INFO[tab];
    h += `<div class="miss">🧾 ${nm}：<b>数据源无</b>——还没接上数据（先把页面做出来，请会计部先看看想要什么）。</div>`
      + `<div class="card"><div class="ct">接上以后这里显示</div><div class="note">${what}</div><div class="ct" style="margin-top:10px">数据从哪里来</div><div class="note">${src}</div>`
      + `<button class="btn sub" onclick="ask(${jq(tab)})">💬 对这一页提意见</button></div>`;
  }
  $('body').innerHTML = h;
  $('foot').innerHTML = `只有会计部密码和股东密码看得到。<br><a onclick="changeKey()">🔑 换密码</a>　版本 ${APPV.replace('kuaiji-v', '')}`;
}

// ===== 11/19 📋 事项汇报（GitHub kuaiji《事项汇报模块_指令.md》）=====
// 员工：选自己的名字 → 只看自己的事项（每日／每月／不定期）→ 每件点「完成／进行中／卡住」（卡住必须写卡在哪里）。
// 管理者：汇总（应报・已报・还没报・卡住・逾期，还没报名单・卡住清单・逾期清单・每人进度）＋新增事项。
// 数据存在后台同一份表（what=sx 读・what=sxdo 写，「事项清单」「事项汇报」工作表），大家手机看到的是同一份。
let SX = (() => { try { return JSON.parse(LS.get('acsx', 'null')); } catch (e) { return null; } })(), sxErr = '', sxBusy = false, sxMode = LS.get('sxMode', 'me'), sxWho = LS.get('sxWho', ''), sxStuck = '', sxMsg = '', sxSaving = '';
async function loadSx() {
  if (sxBusy) return; sxBusy = true;
  try {
    const d = await api('&what=sx');
    if (d && d.items) { SX = d; sxErr = ''; LS.set('acsx', JSON.stringify(d)); }
    else if (d && d.error === 'device') sxErr = '这台手机没登记';

      + (o['电话'] || o['RB预约编号'] ? `<div class="dl">${o['电话'] ? `📞 <a href="tel:${esc(o['电话'])}" style="color:var(--brand);font-weight:700">${esc(o['电话'])}</a>　` : ''}${o['RB详情'] ? `<a onclick="togDet(${jq(id)})" style="color:var(--brand);font-weight:700;cursor:pointer">📒 预约台账 ${detOpen.has(id) ? '▲' : '▼'}</a>` : ''}</div>` : '') + (detOpen.has(id) ? detPanel(o) : '')   // 11/19 跟进汇款用：客人电话・预约台账
      + `<div class="dl">${esc(o['联系・结果'])}：${esc(o['联系・谁'])} ${esc(o['联系・时间'].slice(5))}（${days} 天前${days >= 7 ? '，<b>超过一周还没到账</b>' : ''}）${o['联系・说明'] ? '　' + esc(o['联系・说明']) : ''}</div>`
      + `<div class="bt3" style="grid-template-columns:1fr 1fr"><button class="b1${nsOpen[id] === 'ok' ? ' cur' : ''}" onclick="nsPick(${jq(id)},'ok')">✅ 回款成功</button><button class="b3${nsOpen[id] === 'ng' ? ' cur' : ''}" onclick="nsPick(${jq(id)},'ng')">✗ 没回款</button></div>`
      + (nsOpen[id] === 'ok' ? `<div class="stk" style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input id="na_${esc(id)}" inputmode="numeric" placeholder="到账金额" value="${esc(o['请求额'])}"><input id="nd_${esc(id)}" type="date" value="${td}"></div>`

  // 按店
  const by = {};
  rows.forEach(o => { const k = o['公司'] + ' ' + o['店'], b = by[k] = by[k] || { n: 0, a: 0, q: 0, g: 0 }; b.n++; b.a += +o['合计'] || 0; if (NS_PAY.includes(o['联系・结果'])) b.q += +o['请求额'] || 0; b.g += +o['到账・金额'] || 0; });
  const ks = Object.keys(by).sort((x, y) => by[y].n - by[x].n || by[y].a - by[x].a);
  if (ks.length) h += `<div class="grp">🏪 按店（${esc(lab)}）</div><div class="card">` + ks.map(k => `<div class="row"><b>${esc(k)}</b>　${by[k].n} 组　预约合计 ${yen(by[k].a)}<br><small>请求 ${yen(by[k].q)}・已收回 ${yen(by[k].g)}</small></div>`).join('') + '</div>';
  h += `<div class="grp">✓ 会计已确认（${paid.length}）</div>` + (paid.length ? '<div class="card">' + paid.slice(0, 50).map(o => `<div class="row">${esc(paidDay(o))}　${+o['到账・金额'] ? '<b>' + yen(o['到账・金额']) + '</b>' : '<b style="color:var(--bad)">✗ 没回款</b>'}　${esc(o['公司'])} ${esc(o['店'])} ${esc(o['客人'])} 様<br><small>确认：${esc(o['到账・谁'])}${o['到账・说明'] ? '　' + esc(o['到账・说明']) : ''}　</small><a onclick="nsUndo(${jq(o['编号'])})" style="color:var(--sub);font-size:12px;text-decoration:underline;cursor:pointer">撤销</a>${nsMsg[o['编号']] || ''}</div>`).join('') + '</div>' : '<div class="note">这段时间还没有。</div>');
  // 每月：APP 里的（请求・到账）＋ 用户给的返金历史（各公司每月收回）
  const byM = {};
  hist.forEach(x => { const m = x[1]; (byM[m] = byM[m] || { h: 0, q: 0, g: 0, co: {} }).h += +x[2] || 0; byM[m].co[x[0]] = (byM[m].co[x[0]] || 0) + (+x[2] || 0); });
  rows.forEach(o => { const m = o['预约日'].slice(0, 7), b = byM[m] = byM[m] || { h: 0, q: 0, g: 0, co: {} }; if (NS_PAY.includes(o['联系・结果'])) b.q += +o['请求额'] || 0; b.g += +o['到账・金额'] || 0; });
  const ms = Object.keys(byM).sort().reverse();

    + `<div class="note">2〜10 月是股东给的「お客様から返金」表（各公司合计）；11 月起是 APP 里一单一单确认的。</div></div>`;
  return h;
}
