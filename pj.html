<style>
/* 11/16 运营部：评价管理（各平台）・人事评价（店长月度考核）・卫生检查。样式和空桌一览同一套颜色。
   这一个文件两处用：独立 APP（eeesion1-code.github.io/yunying/ 的 index.html）和 空桌一览 里的 pj.html（内容完全一样，改了要两边一起放）。 */
:root{
  --bg:#f5f6f8;--card:#fff;--ink:#16181d;--sub:#6b7280;--faint:#9ca3af;--line:#e6e8ec;--soft:#f0f2f5;
  --brand:#1d4ed8;--good:#15803d;--goodBg:#ecfdf3;--warn:#b45309;--warnBg:#fef3c7;--bad:#dc2626;--badBg:#fee2e2;
  --g:#1a73e8;--t:#c2410c;--h:#be123c;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1115;--card:#181b21;--ink:#eceef2;--sub:#a1a7b3;--faint:#6b7280;--line:#2a2f38;--soft:#20242c;
    --brand:#3b82f6;--good:#22c55e;--goodBg:#11281a;--warn:#facc15;--warnBg:#2f2a10;--bad:#f87171;--badBg:#361515;
    --g:#8ab4f8;--t:#fb923c;--h:#fb7185;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
a{color:var(--brand);text-decoration:none}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 14px 0}
.top{display:flex;align-items:center;gap:8px}
.back{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:14px}
.logo{width:30px;height:30px;border-radius:8px;display:block}
.foot{font-size:12px;color:var(--faint);text-align:center;margin:20px 0 0;line-height:1.8}
.foot a{color:var(--sub);text-decoration:underline}
h1{font-size:19px;margin:0;flex:1}
.at{font-size:12px;color:var(--sub)}
.tabs{display:flex;gap:6px;margin:10px 0 0;overflow-x:auto;padding-bottom:8px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;min-width:max-content;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 8px;font-size:15px;font-weight:700}
@media (max-width:420px){.tabs{gap:4px}.tabs button{padding:8px 5px;font-size:13px}}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
/* 11/16 预约异常・各店：一家一块，7 天一格 */
.ycwrap{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:1000px){.ycwrap{grid-template-columns:1fr 1fr}}
.ycc{padding:8px 8px 4px;margin:0;min-width:0;overflow:hidden}
.ycwrap>*{min-width:0}
.ycg{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;margin-top:4px}
.ycg th{font-size:11px;font-weight:700;padding:2px 1px;text-align:center;line-height:1.25}
.ycg td{text-align:center;padding:3px 1px;line-height:1.25;white-space:nowrap}
.ycg td.lb{text-align:left;color:var(--sub);max-width:92px;overflow:hidden;text-overflow:ellipsis;padding-right:4px}
.ycg tr.pg1 td{border-top:1px solid var(--line)}
.ycg tr.pg td:not(.lb){font-size:16px;line-height:1.15}
@media (max-width:430px){.ycg{font-size:11px}.ycg th{font-size:10px}.ycg td.lb{max-width:72px}.ycg td{padding:3px 0}.ycc{padding:8px 6px 4px}}
main{padding:12px 14px calc(30px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.sec{margin:0 0 16px}
.sec h2{font-size:16px;margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
.sec h2 small{font-size:12px;color:var(--sub);font-weight:400;margin-left:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px}

.kv{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.kv td{padding:3px 0;border-top:1px solid var(--line);vertical-align:top}

.kv td small{display:block;font-weight:400;color:var(--sub);font-size:11px}
.plat{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}

.selbar span{font-weight:700;white-space:nowrap}.selbar select{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--card);color:var(--ink);font-size:15px}

.ycchk textarea{display:block;width:100%;box-sizing:border-box;margin-top:4px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:14px;background:var(--card);color:var(--ink);resize:vertical;font-family:inherit}
.sgq{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.sgq button{background:var(--soft) !important;color:var(--ink) !important;font-weight:400 !important;font-size:12px;padding:3px 8px !important}
.sgprev{font-size:12px;margin-top:4px;padding:4px 6px;border-radius:6px;background:var(--soft);color:var(--ink)}
.sghow{font-size:13px;margin-top:2px;color:var(--ink);white-space:pre-line;word-break:break-word}
@media (max-width:640px){.ycchk{width:100%}}
.up{color:var(--good)}.dn{color:var(--bad)}.wn{color:var(--warn)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap}
.p-bad{background:var(--badBg);color:var(--bad)}.p-warn{background:var(--warnBg);color:var(--warn)}.p-good{background:var(--goodBg);color:var(--good)}
.p-soft{background:var(--soft);color:var(--sub)}
.rv{border-top:1px solid var(--line);padding:10px 0}
.rv:first-child{border-top:0;padding-top:2px}
.rvh{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}
.rvh .who{color:var(--sub);font-size:12px}
.rvt{font-size:14px;margin:4px 0 0;white-space:pre-line;word-break:break-word}
u.ng{text-decoration:underline;text-decoration-color:var(--bad);text-decoration-thickness:2px;text-underline-offset:3px}
.rvf{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:12px;color:var(--sub)}
.stars{color:#f59e0b;letter-spacing:-1px;font-size:13px}
.seg{display:flex;gap:6px;margin:0 0 8px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap;flex:0 0 auto}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rows .r{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 2px;border-top:1px solid var(--line);align-items:center}
.rows .r:first-child{border-top:0}
.r .nm{font-weight:700;font-size:15px}
.r .nm small{font-weight:400;color:var(--sub);font-size:12px;margin-left:4px}
.r .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--sub)}
.r .meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.r .big{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.r.open{background:var(--soft);border-radius:10px}
.det{grid-column:1/-1;margin-top:6px}
.bar{position:relative;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.dim{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.dim .v{text-align:right;font-variant-numeric:tabular-nums}
.dimtxt{grid-column:2/-1;font-size:12px;color:var(--sub);margin:-4px 0 4px}
.mini{display:flex;gap:2px;align-items:flex-end;height:26px}
.mini i{flex:1;background:var(--t);opacity:.75;border-radius:2px 2px 0 0;min-height:1px}
.mini2{display:flex;gap:6px;font-size:11px;color:var(--sub);justify-content:space-between}
.note{font-size:12px;color:var(--sub);line-height:1.6;margin:6px 0 0}
.empty{padding:28px 10px;text-align:center;color:var(--sub)}

.gS{background:#14532d;color:#fff}.gA{background:var(--good);color:#fff}.gB{background:#0369a1;color:#fff}.gC{background:var(--warn);color:#fff}.gD{background:var(--bad);color:#fff}
.dist{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:6px 0 2px}
.dist span{display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;min-width:22px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:400;color:var(--sub);text-align:right;padding:4px 4px;border-bottom:1px solid var(--line)}
.tbl td{text-align:right;padding:5px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.issue{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.issue:first-child{border-top:0}
.issue .x{grid-column:2;color:var(--sub);font-size:12px}
.lk{font-size:12px}
.err{background:var(--warnBg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin:0 0 12px}
.syq{width:100%;font:inherit;font-size:16px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin:0 0 8px}
.syst{font-size:13px;color:var(--sub);margin:12px 2px 4px;display:flex;gap:8px;align-items:baseline}
.syst b{color:var(--ink);font-size:15px}
.mcell{display:inline-block;min-width:44px;text-align:center;font-size:12px;border-radius:6px;padding:1px 4px;margin:0 3px 3px 0;background:var(--soft);color:var(--sub);font-variant-numeric:tabular-nums}
.mcell b{display:block;font-size:14px;color:var(--ink)}
/* T预约 */
.tyc{font-size:11px;color:var(--sub);line-height:1.35}
.tyc .up,.tyc .dn{font-weight:700}
.tyhd{display:flex;align-items:center;gap:10px;margin:0 0 8px;flex-wrap:wrap}
.rows .r.tyr{grid-template-columns:minmax(0,1fr) 88px 88px;align-items:start}
.tyn{text-align:right;line-height:1.2}
.tyn b{font-size:20px;font-variant-numeric:tabular-nums}
.tyn small{font-size:11px;color:var(--sub);margin-left:2px}
.tyn .tyc{display:block;margin-top:2px}
.typick{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 8px}
.typick input[type=date],.tysel{font:inherit;font-size:15px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.tysel{margin-left:auto;font-size:13px}
/* 11/16 用户：老板在电脑上看要像网页（宽屏多栏），手机上保持单栏 */
.hdin{max-width:760px;margin:0 auto}
@media (min-width:1000px){
  body{font-size:15px}
  .hdin,main{max-width:1240px}
  main{padding:16px 24px 40px}
  header{padding-left:0;padding-right:0}
  .hdin{padding:0 24px}
  .mcell{min-width:38px}
  .tabs{justify-content:flex-start}
  .tabs button{flex:0 0 auto;padding:9px 22px}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}

  .kpi b{font-size:30px}
  .rows{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
  .rows .r:nth-child(2){border-top:0}
  .rows .r.open{grid-column:1/-1}
  .sylist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:10px}

.keybox{max-width:360px;margin:40px auto;text-align:center}
.keybox input{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin:10px 0}
.keybox button{width:100%;border:0;background:var(--brand);color:#fff;border-radius:10px;padding:10px;font-weight:700}
.navhint{position:fixed;top:45%;z-index:9999;padding:8px 14px;border-radius:999px;background:rgba(0,0,0,.72);color:#fff;font-size:15px;font-weight:700;pointer-events:none;opacity:0;transition:opacity .12s}
.navhint.go{background:var(--brand,#3b82f6)}
</style>

<header>
 <div class="hdin">
  <div class="top">
    <a class="back" id="back" href="./" style="display:none">‹ 空桌一览</a>
    <img class="logo" id="logo" src="icon-192.png" alt="" style="display:none">
    <h1>运营部</h1>
    <span class="at" id="at"></span>
  </div>

 </div>

<main id="main"><div class="empty">读取中…</div></main>
<script>
// 空桌一览里的 pj.html：最上层再滑就回空桌一览（IN_KZ 在下面定义，用的时候才读）
function navTop() { return IN_KZ ? () => { location.href = './'; } : null; }
// ===== 11/18 用户：「苹果手机中间或中下部分向左滑或右滑可以退回前一页」=====
//   放到主屏幕的 APP 没有浏览器的返回 → 自己记「返回要做的事」（开了哪个页、切了哪个标签），同时写进浏览器历史，
//   所以 Safari 自带的边缘右滑、安卓的返回键也一样能退。手势：从屏幕高度 30% 以下开始，横着滑够远（左右都行）就退一步。
//   不抢：输入框里、能横着滚的地方（标签条・宽表格）、图表上开始的不算；Safari 里（不是主屏幕 APP）贴边开始的留给 Safari 自己。
const NAVS = [];
let navSilent = false, navSkip = 0;
function navPush(tag, undo) {
  if (navSilent) return;
  NAVS.push({ tag, undo });
  if (NAVS.length > 40) NAVS.shift();
  try { history.pushState({ nav: NAVS.length }, ''); } catch (e) {}
}
function navDone(tag) {   // 用按钮关掉的：返回记录里对应那一步一起拿掉
  if (navSilent) return;
  const i = NAVS.map(x => x.tag).lastIndexOf(tag);
  if (i < 0) return;
  const n = NAVS.length - i; NAVS.length = i; navSkip++;
  try { history.go(-n); } catch (e) { navSkip--; }
}
addEventListener('popstate', () => {
  if (navSkip) { navSkip--; return; }
  const f = NAVS.pop();
  if (!f) return;
  navSilent = true;
  try { f.undo(); } catch (e) {} finally { navSilent = false; }
});
const navCan = () => NAVS.length > 0 || !!navTop();
function navBack() { if (NAVS.length) history.back(); else { const f = navTop(); if (f) f(); } }
(() => {
  const SA = !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));
  let on = false, sx = 0, sy = 0, st = 0, hint = null;
  const show = dx => {
    if (!hint) { hint = document.createElement('div'); hint.className = 'navhint'; hint.textContent = '‹ 返回'; document.body.appendChild(hint); }
    const k = Math.min(1, Math.abs(dx) / Math.min(110, innerWidth * 0.28));
    hint.style.opacity = String(0.25 + 0.75 * k);
    hint.style.left = dx > 0 ? '10px' : ''; hint.style.right = dx > 0 ? '' : '10px';
    hint.classList.toggle('go', k >= 1);
  };
  const hide = () => { if (hint) hint.style.opacity = '0'; };
  const hScroll = el => { for (; el && el !== document.body && el !== document.documentElement; el = el.parentElement) {
    if (el.scrollWidth > el.clientWidth + 2) { const o = getComputedStyle(el).overflowX; if (o === 'auto' || o === 'scroll') return true; } } return false; };
  addEventListener('touchstart', e => {
    on = false;
    if (e.touches.length !== 1 || !navCan()) return;
    const t = e.touches[0];
    if (t.clientY < innerHeight * 0.3) return;
    if (!SA && (t.clientX < 28 || t.clientX > innerWidth - 28)) return;
    const el = e.target instanceof Element ? e.target : null;
    if (el && (el.closest('input,textarea,select,svg,canvas,[data-noswipe]') || hScroll(el))) return;
    on = true; sx = t.clientX; sy = t.clientY; st = Date.now();
  }, { passive: true });
  addEventListener('touchmove', e => {
    if (!on) return;
    const t = e.touches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dy) > 40 && Math.abs(dy) > Math.abs(dx)) { on = false; hide(); return; }
    if (Math.abs(dx) > 24) show(dx);
  }, { passive: true });
  addEventListener('touchend', e => {
    if (!on) return;
    on = false; hide();
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) >= Math.min(110, innerWidth * 0.28) && Math.abs(dx) > 2 * Math.abs(dy) && Date.now() - st < 900) navBack();
  }, { passive: true });
  addEventListener('touchcancel', () => { on = false; hide(); }, { passive: true });
})();

const APPV = 'yunying-v53';   // 独立 APP 的版本号：和 sw.js 的 V 一起改（checkUpdate 用）
const IN_KZ = /\/kongzhuo\//.test(location.pathname);   // 在 空桌一览 里面（pj.html）还是独立 APP
const API = 'https://script.google.com/macros/s/AKfycbxDX1OB8iAKYYpfBlncpfov66qsDdWfq6wjs2xNGydXDbkkUPf7NsOwwmd_PG2Dbpe0/exec';
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const LOCAL = /[?&]local=1/.test(location.search);   // 本机测试：读 ./_pj.json ./_hr.json
let K = LS.get('k', '');

  const note = '<div class="sec"><p class="note">📌 怎么看：<br>・<b>回头率</b>＝回头客 ÷ 扫码登录的客人。只有扫码登录 ダイニー 的客人才认得出是不是来过，所以用登录的人当分母，各店才比得了（ダイニー 页面上的「リピーター比率」是除以全部客数，数字会小很多）。<br>・<b>登录率</b>＝扫码登录的客人 ÷ 客数，大约一半。登录率越高，回头客认得越全。<br>・ダイニー 最早 2025 年 4 月起有数据，各店陆续上线（那之前的月份写「—」）。回头率往上走有一部分是因为 ダイニー 记住的客人越来越多，<b>同比</b>要考虑这一点，各店之间比更公平。<br>・只有用 ダイニー 收银的 5 家店；三幸園的客人不扫码登录，没有数据。ダイニー 的「再来店意欲」分数忽高忽低，不显示。<br>・每天 12:15 更新，来源：' + esc(meta.src || 'ダイニー') + '。</p></div>';
  const storeTable = (A, B, la, lb) => {
    const L = stores.map(st => { const a = A(st), b = B(st); return { st, a, b, ra: rate(a.r, a.c), rb: rate(b.r, b.c) }; }).sort((x, y) => (y.ra || 0) - (x.ra || 0));
    return '<table class="tbl card"><tr><th>店</th><th>回头率<br><small>' + la + '</small></th><th>回头率<br><small>' + lb + '</small></th><th>差</th><th>回头客<br><small>' + la + ' / ' + lb + '</small></th><th>登录率<br><small>' + la + ' / ' + lb + '</small></th><th>客数<br><small>' + la + ' / ' + lb + '</small></th></tr>' +
      L.map(o => '<tr><td><b>' + esc(o.st) + '</b></td><td><b>' + P(o.ra) + '</b></td><td>' + (o.b.n ? P(o.rb) : '<span class="tyc">还没用 ダイニー</span>') + '</td><td>' + pp(o.ra, o.b.n ? o.rb : null) + '</td><td>' + fmt(o.a.r) + ' / ' + (o.b.n ? fmt(o.b.r) : '—') + '</td><td>' + P(rate(o.a.c, o.a.p)) + ' / ' + (o.b.n ? P(rate(o.b.c, o.b.p)) : '—') + '</td><td>' + fmt(o.a.p) + ' / ' + (o.b.n ? fmt(o.b.p) : '—') + '</td></tr>').join('') + '</table>';
  };
  const kpi3 = (A, B, la, lb) => '<div class="grid g3">' +
    '<div class="card kpi"><span class="plat">登录客里的回头率</span><br><b>' + P(rate(A.r, A.c)) + '</b> <span class="tyc">' + la + '</span><div class="d">' + lb + ' ' + P(rate(B.r, B.c)) + '　' + pp(rate(A.r, A.c), B.n ? rate(B.r, B.c) : null) + '</div></div>' +
    '<div class="card kpi"><span class="plat">回头客</span><br><b>' + fmt(A.r) + '</b> 人 <span class="tyc">' + la + '</span><div class="d">' + lb + ' ' + (B.n ? fmt(B.r) + ' 人　' + pn(A.r, B.r) : '—') + '</div></div>' +
    '<div class="card kpi"><span class="plat">扫码登录率</span><br><b>' + P(rate(A.c, A.p)) + '</b> <span class="tyc">' + la + '</span><div class="d">' + lb + ' ' + (B.n ? P(rate(B.c, B.p)) + '　' + pp(rate(A.c, A.p), rate(B.c, B.p)) : '—') + '</div></div></div>';

  if (rkMode === 'y') {   // ---------- 同比：同一个月份，今年和去年放在一起 ----------
    const cand = months.filter(mm => months.includes((+mm.slice(0, 4) - 1) + mm.slice(4)));
    const m = cand.includes(rkMonth) ? rkMonth : (cand.filter(x => x < cur).pop() || cand[cand.length - 1]);
    if (!m) return h + '<div class="sec"><p class="note">还没有能同比的月份（要去年同月也有数据）。</p></div>' + note;
    const ly = (+m.slice(0, 4) - 1) + m.slice(4);
    h += '<div class="seg">' + cand.map(mm => '<button class="' + (mm === m ? 'on' : '') + '" onclick="rkSet(\'' + mm + '\')">' + +mm.slice(5) + '月' + (partial(mm) ? '（进行中）' : '') + '</button>').join('') + '</div>';
    const SL = both([m], [ly]), A = aggS([m], SL), B = aggS([ly], SL);
    h += '<div class="sec"><h2>🔁 ' + +m.slice(5) + '月 同比<small>' + mLab(m) + (partial(m) ? '（截至 ' + esc((meta.upto || '').slice(5).replace('-', '/')) + '，还没过完）' : '') + ' 对比 ' + mLab(ly) + '</small></h2>' + kpi3(A, B, mLab(m), mLab(ly)) + sameNote(SL) + '</div>';
    h += '<div class="sec"><h2>🏪 各店同比</h2>' + storeTable(st => agg([m], st), st => agg([ly], st), mLab(m), mLab(ly)) + '</div>';
    // 所有月份：一行一个月份，各年并排
    const yrs = [...new Set(months.map(x => x.slice(0, 4)))].sort();
    h += '<div class="sec"><h2>📅 每个月份并排<small>当时用 ダイニー 的店合计的回头率</small></h2><table class="tbl card"><tr><th>月份</th>' + yrs.map(y => '<th>' + y + '</th>').join('') + (yrs.length > 1 ? '<th>同比</th>' : '') + '</tr>' +
      Array.from({ length: 12 }, (_, i) => String(i + 1).padStart(2, '0')).filter(mo => yrs.some(y => months.includes(y + '-' + mo))).map(mo => {
        const v = yrs.map(y => { const x = agg(months.includes(y + '-' + mo) ? [y + '-' + mo] : []); return x.n ? rate(x.r, x.c) : null; });
        return '<tr' + (mo === m.slice(5) ? ' style="background:var(--soft,rgba(0,0,0,.04))"' : '') + '><td><b>' + +mo + '月</b></td>' + v.map((x, i) => '<td>' + P(x) + (partial(yrs[i] + '-' + mo) && x != null ? '<small class="tyc">（进行中）</small>' : '') + '</td>').join('') + (yrs.length > 1 ? '<td>' + pp(v[v.length - 1], v[v.length - 2]) + '</td>' : '') + '</tr>';
      }).join('') + '</table><p class="note">2025 年 4〜10 月有的店还没用 ダイニー（4 月 1 家、5 月 1 家、6 月 2 家、7〜9 月 3 家、10 月 4 家），合计的同比要连这个一起看；各店同比更准。</p></div>';
    return h + note;
  }

  if (rkMode === 'r') {   // ---------- 区间对比：自己选两段 ----------
    const lastF = full[full.length - 1] || months[months.length - 1], i3 = Math.max(0, full.length - 3);
    const dflt = { a0: full[i3] || months[0], a1: lastF };
    dflt.b0 = (+dflt.a0.slice(0, 4) - 1) + dflt.a0.slice(4); dflt.b1 = (+dflt.a1.slice(0, 4) - 1) + dflt.a1.slice(4);
    if (!months.includes(dflt.b0)) dflt.b0 = months[0];
    if (!months.includes(dflt.b1)) dflt.b1 = months[Math.min(months.length - 1, 2)];
    const R = {}; ['a0', 'a1', 'b0', 'b1'].forEach(k => R[k] = months.includes(rkR[k]) ? rkR[k] : dflt[k]);
    if (R.a0 > R.a1) [R.a0, R.a1] = [R.a1, R.a0];
    if (R.b0 > R.b1) [R.b0, R.b1] = [R.b1, R.b0];
    const sel = k => '<select onchange="rkSetR(\'' + k + '\', this.value)" style="padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:14px">' + months.map(mm => '<option value="' + mm + '"' + (mm === R[k] ? ' selected' : '') + '>' + mLab(mm) + (partial(mm) ? '（进行中）' : '') + '</option>').join('') + '</select>';
    const qk = (a0, a1, b0, b1) => '<button onclick="rkR={a0:\'' + a0 + '\',a1:\'' + a1 + '\',b0:\'' + b0 + '\',b1:\'' + b1 + '\'};LS.set(\'rkR\',JSON.stringify(rkR));render()">';
    const yb = x => (+x.slice(0, 4) - 1) + x.slice(4), pm = (x, n) => { const d = new Date(+x.slice(0, 4), +x.slice(5) - 1 + n, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
    h += '<div class="card" style="margin-bottom:10px;font-size:14px;line-height:2.2"><b style="color:var(--brand)">A 段</b> ' + sel('a0') + ' 〜 ' + sel('a1') + '<br><b style="color:var(--sub)">B 段</b> ' + sel('b0') + ' 〜 ' + sel('b1') +
      '<div class="seg" style="margin:6px 0 0">' + qk(full[i3], lastF, yb(full[i3] || lastF), yb(lastF)) + '近 3 个月 对 去年同期</button>' + qk(lastF, lastF, pm(lastF, -1), pm(lastF, -1)) + '上个月 对 再上个月</button>' + qk(pm(lastF, -2), lastF, pm(lastF, -5), pm(lastF, -3)) + '近 3 个月 对 再前 3 个月</button></div></div>';
    const MA = mRange(R.a0, R.a1), MB = mRange(R.b0, R.b1);
    const la = 'A ' + (R.a0 === R.a1 ? mLab(R.a0) : mLab(R.a0) + '〜' + +R.a1.slice(5) + '月'), lb = 'B ' + (R.b0 === R.b1 ? mLab(R.b0) : mLab(R.b0) + '〜' + +R.b1.slice(5) + '月');
    h += '<div class="sec"><h2>↔ 区间对比<small>' + esc(la) + '（' + MA.length + ' 个月）对比 ' + esc(lb) + '（' + MB.length + ' 个月）' + (MA.concat(MB).some(partial) ? '・含进行中的月份' : '') + '</small></h2>' + (() => { const SL = both(MA, MB); return kpi3(aggS(MA, SL), aggS(MB, SL), la, lb) + sameNote(SL); })() + '</div>';
    h += '<div class="sec"><h2>🏪 各店</h2>' + storeTable(st => agg(MA, st), st => agg(MB, st), 'A', 'B') + '<p class="note">回头客・客数是这段时间加起来的；回头率・登录率＝加起来再除。两段月数不一样时，看回头率・登录率（比例）更公平。</p></div>';
    return h + note;
  }

  // ---------- 按月（原来的） ----------
  const m = months.includes(rkMonth) ? rkMonth : (full[full.length - 1] || months[months.length - 1]);
  const prevM = months[months.indexOf(m) - 1], lyM = (+m.slice(0, 4) - 1) + m.slice(4);
  const g = mm => agg([mm]);
  const G = g(m), GP = prevM ? g(prevM) : null, GL = months.includes(lyM) ? g(lyM) : null;
  h += '<div class="seg">' + months.map(mm => '<button class="' + (mm === m ? 'on' : '') + '" onclick="rkSet(\'' + mm + '\')">' + mLab(mm) + (partial(mm) ? '（进行中）' : '') + '</button>').join('') + '</div>';

  h += '<div class="sec"><h2>🔁 ' + mLab(m) + ' 回头客<small>' + (SEL ? esc(SEL) : 'ダイニー 5 家店') + (partial(m) ? '・截至 ' + esc((meta.upto || '').slice(5).replace('-', '/')) : '') + '</small></h2><div class="grid g3">' +
    '<div class="card kpi"><span class="plat">登录客里的回头率</span><br><b>' + P(gr) + '</b> ' + (GP ? '比上月 ' + pp(gr, rate(GP.r, GP.c)) : '') + (GL ? '　同比 ' + pp(gr, rate(GL.r, GL.c)) : '') + spark(trend, 200, 34, 'var(--good)', true) + '</div>' +
    '<div class="card kpi"><span class="plat">回头客</span><br><b>' + fmt(G.r) + '</b> 人 ' + (GP && !partial(m) ? '比上月 ' + pn(G.r, GP.r) : '') + (GL && !partial(m) ? '　同比 ' + pn(G.r, GL.r) : '') + spark(months.map(mm => g(mm).r), 200, 34, 'var(--ink)', true) + '</div>' +
    '<div class="card kpi"><span class="plat">扫码登录率</span><br><b>' + P(rate(G.c, G.p)) + '</b> ' + (GP ? '比上月 ' + pp(rate(G.c, G.p), rate(GP.c, GP.p)) : '') + '<br><span class="note">客数 ' + fmt(G.p) + ' 人，登录 ' + fmt(G.c) + ' 人</span></div>' +
    '</div></div>';
  const list = stores.map(st => { const x = get(m, st) || { p: 0, c: 0, r: 0 }, y = prevM && get(prevM, st);
    return { st, x, has: !!get(m, st), rr: rate(+x.r, +x.c), pr: y ? rate(+y.r, +y.c) : null, ci: rate(+x.c, +x.p), tr: months.map(mm => { const z = get(mm, st); return z ? rate(+z.r, +z.c) : null; }) }; })
    .sort((a, b) => (b.rr || 0) - (a.rr || 0));
  const on = list.filter(o => o.has), best = on[0], worst = on[on.length - 1];
  h += '<div class="sec"><h2>🏪 各店<small>按回头率排</small></h2><table class="tbl card"><tr><th>店</th><th>回头率</th><th>比上月</th><th>回头客</th><th>登录率</th><th>客数</th><th style="width:22%">走势</th></tr>' +
    list.map(o => !o.has ? '<tr><td><b>' + esc(o.st) + '</b></td><td colspan="6" class="tyc">这个月还没用 ダイニー</td></tr>' : '<tr><td><b>' + esc(o.st) + '</b></td><td><b class="' + (o === best ? 'up' : o === worst ? 'dn' : '') + '">' + P(o.rr) + '</b></td><td>' + pp(o.rr, o.pr) + '</td><td>' + fmt(o.x.r) + '</td><td' + (o.ci != null && o.ci < 0.45 ? ' class="wn"' : '') + '>' + P(o.ci) + '</td><td>' + fmt(o.x.p) + '</td><td>' + spark(o.tr, 120, 26, 'var(--good)', false) + '</td></tr>').join('') + '</table>';
  if (best && worst && best !== worst) h += '<p class="note">' + mLab(m) + '：<b>' + esc(best.st) + '</b> 回头率最高（' + P(best.rr) + '），<b>' + esc(worst.st) + '</b> 最低（' + P(worst.rr) + '）。登录率低于 45% 标黄——登录的人少，认得出的回头客也少。</p>';
  h += '</div>';
  return h + note;
}

const QR_KAN = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十'];

async function loadQr() {
  const c = qrCfg();
  if (LOCAL && !c) { try { const r = await fetch('./_qr.json', { cache: 'no-store' }); QRD = await r.json(); } catch (e) {} if (tab === 'qr') render(); return; }
  if (!c || qrBusy || BLOCKED) return;
  qrBusy = true; qrErr = ''; if (tab === 'qr') render();

    if (!d || !d.ok) throw new Error((d && d.err) || '读取失败');
    QRD = d; cachePut('qr', d);

function qrSetPer(p) { qrPer = p; LS.set('qrPer', p); render(); }
function qrSetStore(v) { qrStore = v; LS.set('qrStore', v); render(); }
function renderQr() {

  const hm = ms => { const d = new Date(ms); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };

    '<div class="card kpi"><small>保存</small><b>' + fmt(cur.tot.s) + '</b><span class="u">人</span>' + (range && sel.length ? '<div class="d">日均 ' + fmt(Math.round(cur.tot.s / sel.length)) + ' 人</div>' : '') +
    '<div class="d">' + cmp(cN.tot.s, okp.length ? cP.tot.s : null) + '</div></div></div>';
  // ③ 每天合计
  const show = range ? days.filter(d => d['日'] >= tyA && d['日'] <= tyB) : days;
  const tot1 = d => Object.values(d.p).reduce((a, v) => a + (v[1] || 0), 0);
  const mx = Math.max(1, ...show.map(tot1));
  const multiM = show.length > 0 && show[0]['日'].slice(0, 7) !== show[show.length - 1]['日'].slice(0, 7);
  if (show.length) h += '<div class="card" style="margin-bottom:10px"><div class="tyc" style="margin-bottom:6px">每天网上预约合计' + (range ? '' : '（点柱子换日子）') + '</div><div style="display:flex;gap:6px;align-items:flex-end;height:96px">' +
    show.map(d => { const t = tot1(d), on = range || d['日'] === tyDay; return '<div style="flex:1;min-width:0;text-align:center;cursor:pointer" onclick="tySet(\'day\',\'' + d['日'] + '\');tySet(\'mode\',\'day\')"><div style="font-size:11px">' + fmt(t) + '</div><div style="height:' + Math.round(t / mx * 60) + 'px;background:' + (on ? 'var(--t)' : 'var(--line)') + ';border-radius:4px 4px 0 0"></div><div style="font-size:11px;color:var(--sub)">' + (multiM ? +d['日'].slice(5, 7) + '/' + +d['日'].slice(8) : +d['日'].slice(8) + '日') + WKD[dOf(d['日']).getDay()] + '</div></div>'; }).join('') + '</div></div>';
  // ④ 时间段（每个钟头进了多少预约）
  const stores = Object.keys(cur.st).sort((a, b) => (cur.st[b].r || 0) - (cur.st[a].r || 0));
  const hb = (list, onlyStore) => {   // 时段 → [预约, 保存]
    const m = new Map();
    list.forEach(ds => {
      const x = HRS[ds]; if (!x) return;
      x.h.forEach((end, i) => {
        const st = i === 0 ? '0' : x.h[i - 1].replace(':00', ''), en = end.replace(':00', '');
        const lab = st + '-' + en + '点';
        let r = 0, s = 0;
        Object.entries(x.r || {}).forEach(([pg, arr]) => { if (!onlyStore || (page2st[pg] || pg) === onlyStore) r += arr[i] || 0; });
        Object.entries(x.s || {}).forEach(([pg, arr]) => { if (!onlyStore || (page2st[pg] || pg) === onlyStore) s += arr[i] || 0; });
        const o = m.get(lab) || [0, 0, parseFloat(st)]; o[0] += r; o[1] += s; m.set(lab, o);
      });
    });
    return [...m.entries()].sort((a, b) => a[1][2] - b[1][2] || a[0].localeCompare(b[0]));
  };
  const hourBars = (B, note, cum, lw) => {   // lw＝左边标签宽（T 三个时段的名字长一点）   // cum＝第一格是「0 点到第一次读取」的累计（食べログ页面那份），算最多时段时不算它
    if (!B.length) return '<div class="tyc">' + (note || '这段时间没有每小时数据') + '</div>';
    // 11/16 用户：取消要分开看 → x[1][3]＝其中后来取消的人；有它时 深色＝留着、灰色＝取消，最多时段按留着的算
    const hasC = B.some(x => x[1][3] != null), keep = x => x[1][0] - (x[1][3] || 0);
    const bm = Math.max(1, ...B.map(x => x[1][0])), peak = B.filter((x, i) => !(cum && i === 0 && x[0].startsWith('0-')) || B.length === 1).sort((a, b) => keep(b) - keep(a))[0];
    const sumN = B.reduce((a, x) => a + x[1][0], 0), sumC = B.reduce((a, x) => a + (x[1][3] || 0), 0), sumK = sumN - sumC;
    const head = !peak || !peak[1][0] ? '' : hasC

      const k = keep(x), c = x[1][3] || 0, col = x === peak ? 'var(--bad)' : 'var(--t)';
      return '<div class="dim" style="grid-template-columns:' + (lw || 64) + 'px 1fr 112px"' + (hasC ? ' title="下单 ' + x[1][0] + ' 人，取消 ' + c + ' 人（' + Math.round(c / Math.max(x[1][0], 1) * 100) + '%）"' : '') + '><span>' + x[0] + '</span><span class="bar"><i style="width:' + Math.round(k / bm * 100) + '%;background:' + col + '"></i>' +
        (c ? '<i style="left:' + Math.round(k / bm * 100) + '%;width:' + Math.max(1, Math.round(c / bm * 100)) + '%;background:var(--faint);opacity:.45;border-radius:0 4px 4px 0"></i>' : '') + '</span><span class="v">' + fmt(k) + ' 人' +
        (hasC ? (c ? '<small style="color:var(--sub)">・消 ' + fmt(c) + '</small>' : '') : x[1][1] != null ? '<small style="color:var(--sub)">・存 ' + x[1][1] + '</small>' : '') + '</span></div>';
    }).join('');
  };
  const hsel = sel.filter(s => HRS[s]);
  // 11/16 用户：时间段要完整 → 默认用レストランボード 的受付时间（10/1 起、T・H・G・R、能按店）；食べログ页面每小时那份（11/16 起、只有 T）留作第二个选项
  const PRD = {}; R.forEach(r => { if (r.k === 'pr') PRD[r['日']] = r; });
  // 时间段的店下拉：受付时间模式用レストランボード 里那段时间有预约的店（10 月没有食べログ页面数据时也能选）
  const rbSt = (() => { const t = {}; sel.forEach(ds => Object.entries((PRD[ds] || {}).hs || {}).forEach(([key, m]) => { const [pp, k] = key.split('|'); if (tyHrPl !== 'all' && pp !== tyHrPl) return; t[k] = (t[k] || 0) + Object.values(m).reduce((a, n) => a + n, 0); })); return Object.keys(t).sort((a, b) => t[b] - t[a]); })();
  const hrList = tyHrSrc === 'rb' ? rbSt : stores, hrSt = hrList.includes(tyHrSt) ? tyHrSt : (SEL && hrList.includes(SEL) ? SEL : '');
  const rbHours = (list, onlyStore, pl) => {
    const a = Array(24).fill(0), c = Array(24).fill(0), bz = Array(24).fill(0); let days = 0, inc = 0;   // a＝下单人数，c＝其中后来取消的（hc / hsc），bz＝其中 AA（hb / hsb，都在取消里，最后从 a、c 减掉）
    const addSt = (src, arr) => Object.entries(src || {}).forEach(([key, m]) => { const [pp, k] = key.split('|'); if (k !== onlyStore || (pl !== 'all' && pp !== pl)) return; Object.entries(m).forEach(([hh, n]) => arr[+hh] += n); });
    const addAll = (src, arr) => Object.entries(src || {}).forEach(([pp, v]) => { if (pl !== 'all' && pp !== pl) return; v.forEach((n, i) => arr[i] += n); });
    list.forEach(ds => {
      const o = PRD[ds]; if (!o) return; days++; if (o['缺'] > 0) inc++;
      if (onlyStore) { addSt(o.hs, a); addSt(o.hsc, c); addSt(o.hsb, bz); } else { addAll(o.h, a); addAll(o.hc, c); addAll(o.hb, bz); }
    });
    const boost = bz.reduce((s, n) => s + n, 0);
    return { days, inc, boost, B: a.map((n, i) => [i + '-' + (i + 1) + '点', [n - bz[i], null, i, c[i] - bz[i]]]).filter(x => x[1][0] > 0) };
  };
  // 11/16 用户：T 的时间段只看 3 个（昼・夕方・夜）→ 11/17 用户：「忘记了统计 22〜23:55、0〜11 点…这 6 段」→ T 一天 6 段（H・G・R・全部 照旧按受付钟头）
  //   数据 pr 行 tb：店 → 7 格 [0〜11, 昼, 14〜17, 夕方, 夜, 22 点以后, 时间没写]，每格 [下单人, 取消人, AA 人]（11/16 以前上传的旧格式是 4 格 [昼, 夕方, 夜, 其他]）
  //   真实下单＝下单−AA，真实取消＝取消−AA
  const TBN = ['0〜11点', '昼 11〜14点', '14〜17点', '夕方 17〜19点', '夜 19〜22点', '22点以后'];
  const tBands = (onlyStore, r) => {
    const a = [0, 1, 2, 3, 4, 5, 6].map(() => [0, 0, 0]), old = [0, 0, 0];   // old＝旧格式的「其他」（分不了段）
    const add = (dst, x) => { dst[0] += x[0]; dst[1] += x[1]; dst[2] += x[2]; };
    sel.forEach(ds => Object.entries((PRD[ds] || {}).tb || {}).forEach(([k, v]) => { if (onlyStore && k !== onlyStore) return;
      if (v.length === 4) { add(a[1], v[0]); add(a[3], v[1]); add(a[4], v[2]); add(old, v[3]); } else v.forEach((x, i) => add(a[i], x)); }));
    const B = TBN.map((nm, i) => [nm, [a[i][0] - a[i][2], null, i, a[i][1] - a[i][2]]]), aa = a.reduce((t, x) => t + x[2], 0) + old[2];
    return (r.inc ? '<div class="tyc" style="margin-bottom:4px">⚠ 其中 ' + r.inc + ' 天还在补（之后来店的预约还没读全），数字还会变大</div>' : '') +
      (aa ? '<div class="tyc" style="margin-bottom:4px">已扣掉 AA ' + fmt(aa) + ' 人，下面都是真实的</div>' : '') +
      hourBars(B.every(x => !x[1][0]) ? [] : B, '没有 T 的网上预约', false, 104) +
      (a[6][0] - a[6][2] > 0 ? '<div class="tyc" style="margin-top:4px">另有 ' + fmt(a[6][0] - a[6][2]) + ' 人的预约没写来店时间</div>' : '') +
      (old[0] - old[2] > 0 ? '<div class="tyc" style="margin-top:4px">另有 ' + fmt(old[0] - old[2]) + ' 人是旧数据（0〜11・14〜17・22 点以后混在一起，分不了段），读新数据后会分开</div>' : '');
  };
  // 11/17：食べログ页面（T）也按同样 6 段（「本日 N 人」每小时新增加起来）；第一次读取以前的累计（表头「此前」，或一格跨好几个钟头）分不了段，单独一行
  const TPN = ['0〜11点', '昼 11〜14点', '14〜17点', '夕方 17〜19点', '夜 19〜22点', '22〜23:55'];
  const tPgBands = (list, onlyStore) => {
    const seg = TPN.map(() => [0, 0]), pre = [0, 0]; let any = false;
    const hr = s => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(s || '')); return m ? +m[1] + +m[2] / 60 : null; };

        Object.entries(x.r || {}).forEach(([pg, arr]) => { if (!onlyStore || (page2st[pg] || pg) === onlyStore) r += arr[i] || 0; });

  };
  h += '<div class="card" style="margin-bottom:10px"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px"><b style="font-size:14px">⏰ 时间段</b>' +
    '<span class="seg" style="margin:0">' + [['rb', 'レストランボード（T・H・G・R）'], ['pg', '食べログ页面（T）']].map(([k, n]) => '<button class="' + (tyHrSrc === k ? 'on' : '') + '" onclick="tySet(\'src\',\'' + k + '\')">' + n + '</button>').join('') + '</span>' +
    (tyHrSrc === 'rb' ? '<span class="seg" style="margin:0">' + [['all', '全部'], ['T', 'T'], ['H', 'H'], ['G', 'G'], ['R', 'R']].map(([k, n]) => '<button class="' + (tyHrPl === k ? 'on' : '') + '" onclick="tySet(\'pl\',\'' + k + '\')">' + n + '</button>').join('') + '</span>' : '') +
    '<select class="tysel" onchange="tySet(\'hr\',this.value)"><option value="">全部店</option>' + hrList.map(k => '<option' + (hrSt === k ? ' selected' : '') + '>' + esc(k) + '</option>').join('') + '</select></div>' +
    '<div class="tyc" style="margin-bottom:6px">' + (tyHrSrc === 'rb' && tyHrPl === 'T' ? '那' + (range ? '段时间' : '天') + '进的 T（食べログ）网上预约，订的是哪个时段（按来店开始时间分 6 段：0〜11 点・昼 11〜14・14〜17・夕方 17〜19・夜 19〜22・22 点以后）。<b style="color:var(--t)">深色＝现在还留着的</b>，<span style="color:var(--faint)">灰色＝后来取消的</span>' : tyHrSrc === 'rb' ? '那' + (range ? '段时间每天' : '天') + '几点有人在网上下了预约（レストランボード 的受付时间，只算网上预约' + (range ? '，加起来' : '') + '）。<b style="color:var(--t)">深色＝现在还留着的</b>，<span style="color:var(--faint)">灰色＝后来取消的</span>（数字＝留着的人，「消」＝取消的人）' : '食べログ页面「本日 N 人」每小时增加多少，按下单（点保存）的时间分 6 段：0〜11 点・昼 11〜14・14〜17・夕方 17〜19・夜 19〜22・22〜23:55') + '</div>' +

  let L = Object.entries(cur.st).filter(([k]) => selOk(k));
  L.sort(tySort === 'r' ? (a, b) => (b[1].r ?? -1) - (a[1].r ?? -1) : (a, b) => (b[1].s ?? -1) - (a[1].s ?? -1));
  if (L.length) h += '<div class="sec"><div class="tyhd"><h2 style="margin:0">各店</h2><div class="seg" style="margin:0">' + [['r', '按预约'], ['s', '按保存']].map(([k, n]) => '<button class="' + (tySort === k ? 'on' : '') + '" onclick="tySet(\'sort\',\'' + k + '\')">' + n + '</button>').join('') + '</div><span class="tyc" style="margin-left:auto">点店看品牌页和时间段</span></div><div class="card rows">' +
    L.map(([k, x], i) => {
      const open = tyOpen.has(k), cn = cN.st[k] || {}, cp = cP.st[k] || {};

        '<div class="nm"><span style="color:var(--sub);font-weight:400;font-size:13px;display:inline-block;width:22px">' + (i + 1) + '</span>' + esc(k) + '</div>' +
        '<div class="tyn"><b style="color:var(--t)">' + (x.r ?? '—') + '</b><small>人预约</small>' + cmp(cn.r ?? null, okp.length ? (cp.r ?? null) : null, true) + '</div>' +
        '<div class="tyn"><b>' + (x.s ?? '—') + '</b><small>人保存</small>' + cmp(cn.s ?? null, okp.length ? (cp.s ?? null) : null, true) + '</div>';

          Object.entries(x.pages).map(([pg, v]) => '<tr><td>' + esc(brandShort(pg) || pg) + '</td><td>' + (v[1] ?? '未显示') + '</td><td>' + (v[0] ?? '未显示') + '</td></tr>').join('') + '</table>' +
          '<div class="card"><div class="tyc" style="margin-bottom:4px">⏰ ' + esc(k) + ' 的时间段（' + (tyHrSrc === 'rb' ? (tyHrPl === 'T' ? '来店时段・T' : '受付时间・' + (tyHrPl === 'all' ? 'T・H・G・R' : tyHrPl)) : '食べログ页面') + '）</div>' +
          slot(k) + '</div></div>';   // k 本来就是店（和レストランボード 同名）
      }
      return r + '</div>';
    }).join('') + '</div></div>';
  h += prBlock(R, sel, range);
  h += '<p class="note">预约＝那天在食べログ上产生的网络预约人数（「本日、N人のネット予約が入りました」），不是那天到店的人数；保存＝「本日、N人が保存しました」。当天每小时更新，23:45 那次是全天最终数；「未显示」「没读到」不算进合计（11/13 以前是另一套系统记的，很多页「未显示」；11/14・15 没有数据）。' +
    '灰字「上月同期」＝上个月同一周（1〜7/8〜14/15〜21/22 日〜）的同一个星期几，期间就是每一天各自对上再加起来，两边都有数据的天才比（数据从 11/10 开始记，12 月起才有得比）。数据：KA「运营部\\T的每日保存和每日进的预约数」，电脑每天 12 点读一次。</p>';
  return h;
}

// ---------- 各平台（T・H・G・R）每天进的网上预约：レストランボード 按受付日（运营部\各平台预约），T 和食べログ页面核对 ----------
const PN = { T: '食べログ', H: 'ホットペッパー', G: 'ぐるなび', R: 'Retty' }, PCOL = { T: 'var(--t)', H: 'var(--h)', G: '#b45309', R: '#7c3aed' }, PK = ['T', 'H', 'G', 'R'];
function prBlock(R, sel, range) {

    h += '<div class="tyc" style="margin-bottom:6px">' + L.length + ' 个页面网上订不了' + (nBad ? '，其中 <b style="color:var(--bad)">' + nBad + ' 个要马上确认</b>' : L.some(g => g.ds.some(ycDoneOf)) ? '，<b style="color:var(--good)">要确认的都已经有人处理了</b>' : '，<b>都不用担心</b>（店里满了，或同品牌另一页还能订）') + '。下面按天分块，今天在最上面；同一个网页几天都订不了就在几天里都出现。满不满＝同一时间坐着的人 ≥ 最多人数的 8 成，或组数 ≥ 桌数（座位表格：' + esc(Y['座位表'] || '没找到') + '）</div>';
    h += dl.map((d, i) => {
      const items = (byDay[d] || []).slice().sort((a, b) => (RANK[jOf(a)] - RANK[jOf(b)]) || String(a['店']).localeCompare(String(b['店'])) || String(a['平台']).localeCompare(String(b['平台'])));
      if (!items.length) return '<div class="card" style="margin-bottom:8px;padding:8px 12px;font-size:14px;border-left:4px solid var(--good)">✅ <b>' + dayLb(d, i) + '</b>　所有页面都能网上预约</div>';
      const nb = items.filter(b => (jOf(b) === '没满' || jOf(b) === '待确认') && !ycDoneOf(b)).length;
      return '<div style="margin:14px 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap"><h2 style="margin:0;font-size:16px">' + dayLb(d, i) + '</h2><span style="font-size:13px">' + items.length + ' 个页面订不了' + (nb ? '，<b style="color:var(--bad)">' + nb + ' 个要马上确认</b>' : items.some(ycDoneOf) ? '，<b style="color:var(--good)">都已处理</b>' : '，<b>都不用担心</b>') + '</span></div>' +
        items.map(b => { const j = jOf(b); return '<div class="card" style="border-left:4px solid ' + (ycDoneOf(b) ? 'var(--good)' : JC[j]) + ';margin-bottom:6px;padding:8px 12px"><div class="ycw"><div class="ycm">' +
          '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap"><b style="font-size:15px">' + esc(b['店']) + '・<span style="color:' + PCOL[b['平台']] + '">' + b['平台'] + '</span>「' + esc(b['品牌']) + '」</b><span style="font-size:12px;font-weight:700;color:' + JC[j] + '">' + JT[j] + '</span></div>' +
          '<div style="font-size:13px;margin:3px 0;line-height:1.6">' + mkT(b) + '；RB 已订 ' + (b['已订'] ? b['已订'][0] + ' 组 ' + b['已订'][1] + ' 人（最大一组 ' + b['已订'][2] + ' 人）' : '<span class="tyc">还没读到</span>') +
          (b['峰'] && b['座'] ? '<br><span class="tyc">同一时间最多坐 ' + b['峰'][0] + ' 人／最多 ' + b['座'][1] + ' 人（' + Math.round(b['峰'][0] / Math.max(b['座'][1], 1) * 100) + '%）・' + b['峰'][1] + ' 组／' + b['座'][0] + ' 桌（' + esc(b['峰'][2]) + ' 左右）</span>' : '') + '</div>' +
          '<div class="tyc" style="line-height:1.7">' + (b['另一页'] ? '同品牌另一页还开着：' + esc(b['另一页'][0]) + ' <a href="' + esc(b['另一页'][1]) + '" target="_blank" rel="noopener">看 ↗</a>' : '<span style="color:var(--bad)">这个品牌在这个平台上没有别的页面能订</span>') +
          '　<a href="' + esc(b['链接']) + '" target="_blank" rel="noopener" style="font-weight:700">打开这一页 ↗</a>' +
          // 11/17 用户「订不了的证据要留好，做成 PDF 好追溯」→ 每次查到就存一份（检查结论＋网页截图＋原始数据），放「运营部 → 预约证据清单」
          ((b['证据'] || G[b['链接']]['证据']) ? '　📄 ' + esc(String(b['证据'] || G[b['链接']]['证据']).split('/').pop()) : '　<span style="color:var(--warn)">📄 证据 PDF 这次没存成</span>') + '</div></div>' + ycChk(b, j) + '</div></div>'; }).join('');
    }).join('');
    h += '<p class="note" style="margin-top:4px">📄 后面的文件名＝那次检查存下的证据 PDF，在 Google 云端和电脑的「运营部 → 预约证据清单」里，含当时的网页截图和原始数据。</p>';
  }
  // 11/17 可能重复的预约：同一客人同一天同一家店 ≥2 组都还有效、时间重叠（往后 30 天；H 同一组两行、换账号的旧副本、AA 已先去掉）
  const DP = Y['重复'] || [], STX = { '来店待ち': '等客人来', '待确认': '待确认' };
  if (DP.length) h += '<h2 style="margin:14px 0 6px;font-size:16px">🔁 可能重复的预约（' + DP.length + ' 处，今天起 30 天）</h2><div class="tyc" style="margin-bottom:6px">同一位客人同一天在同一家店订了两组以上，都还有效、时间重叠——会白白占着座位。请店里联系客人确认，删掉多的那组。（已经先去掉、不在这里的：H 平台同一组在 RB 里的两行、11/5 换账号留下的旧账号副本、AA）</div>' +
    DP.map(d => { const id = 'dup|' + d['日'] + '|' + d['店'] + '|' + d['组'].map(g => String(g[3])).sort().join(','), ok = sgDone(id);
      return '<div class="card" style="border-left:4px solid ' + (ok ? 'var(--good)' : 'var(--warn)') + ';margin-bottom:8px;font-size:13px">' + sgWrap('<b style="font-size:14px">' + md(d['日']) + ' ' + esc(d['店']) + '</b>　同一客人 ' + d['组'].length + ' 组' +
      d['组'].map(g => '<div style="margin-top:2px">' + esc(g[0]) + '　<b>' + esc(g[1]) + ' 人</b>　' + (/^[THGR]$/.test(g[2]) ? '<span style="color:' + PCOL[g[2]] + ';font-weight:700">' + g[2] + '</span>' : '电话等') + '　<span class="tyc">受付 ' + esc(String(g[3]).slice(5)) + '・' + esc(STX[g[4]] || g[4]) + '</span></div>').join(''), sgBox([id], '联系客人确认了吗？写上怎么处理的和名字', { 店: d['店'], 摘: md(d['日']) + ' 同一客人 ' + d['组'].length + ' 组' })) + '</div>'; }).join('');
  // 各店（11/16 用户：一家一块——上面 7 天的レストランボード 已订・最大一组・同时最多坐几人，下面每个网页 7 天能不能订，7 天全部显示）
  const RB = Y.rbk ? Object.fromEntries(Object.entries(Y.rb || {}).map(([k, dd]) => [k, Object.fromEntries(Object.entries(dd).map(([d, a]) => [d, Object.fromEntries(Y.rbk.map((kk, i) => [kk, a[i]]))]))])) : (Y.rb || {}), st = {};
  pages.forEach(x => (st[x['店']] = st[x['店']] || []).push(x));
  const mk = (x, d) => { const o = (x['日'] || {})[d] || {}; return '<span style="font-weight:700;' + (x['灰'] ? 'font-size:11px;' : '') + 'color:' + (x['无料'] || x['灰'] || o['记号'] === '无料' ? 'var(--faint)' : o['能订'] ? 'var(--good)' : 'var(--bad)') + '">' + esc(o['记号'] || '—') + '</span>'; };
  const SEAT = Y['座位'] || {};
  const bad = k => st[k].some(x => !x['无料'] && !x['灰'] && dl.some(d => !((x['日'] || {})[d] || {})['能订']));
  const keys = Object.keys(st).sort((a, b) => (bad(b) - bad(a)) || a.localeCompare(b));
  const WD = '日月火水木金土';
  const head = '<tr><th></th>' + dl.map(d => { const t = new Date(d + 'T00:00:00'), w = t.getDay(); return '<th>' + (t.getMonth() + 1) + '/' + t.getDate() + '<br><span style="font-weight:400;color:' + (w === 0 ? 'var(--bad)' : w === 6 ? 'var(--brand)' : 'var(--sub)') + '">' + WD[w] + '</span></th>'; }).join('') + '</tr>';
  h += '<h2 style="margin:14px 0 6px;font-size:16px">各店（' + keys.length + ' 家）</h2><div class="tyc" style="margin-bottom:6px">每家店：上面＝RB 那天已订（组/人，不算取消；AA 和换账号留下的旧副本也不算，在「没算」那行）・最大一组・同一时间最多坐几人（占最多人数的几成，8 成以上橙色）；下面＝每个网页那天能不能订：T 的 ○能订 △少 ×不能；H 的 ◎○△能订 ×满席 TEL＝要打电话；G 的 ○能订 ■リクエスト（也能网上申请）－＝那天网上订不了；R 的 ◯能订 ×订不了（Retty 自己的预约页，按 2 人查）；停止＝网上预约停了，—＝那天网上不接了（多半是时间过了），红字＝订不了；灰字「无料页」＝本来就不接网上预约的免费页；灰字「转H・转G」＝这家的 R 页点预约会跳到 H・G 去订（R 自己不接，H・G 那页照常在查）；「无网约」＝R 页没有网上预约（都不算异常，不预警）</div><div class="ycwrap">' +
    keys.map(k => {
      const c = SEAT[k], r = RB[k] || {};
      const rw = (lb, f) => '<tr><td class="lb">' + lb + '</td>' + dl.map(d => '<td>' + (r[d] ? f(r[d]) : '<span class="tyc">—</span>') + '</td>').join('') + '</tr>';
      return '<div class="card ycc"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><b style="font-size:15px">' + esc(k) + '</b><span class="tyc">' + (c ? c[0] + ' 桌・最多 ' + c[1] + ' 人' : '') + '</span></div><div style="overflow-x:auto"><table class="ycg">' + head +
        rw('已订<small> 组/人</small>', a => '<b>' + a['组'] + '</b>/' + a['人']) +
        (dl.some(d => r[d] && r[d]['去掉'] && (r[d]['去掉'][0] || r[d]['去掉'][1])) ? rw('没算', a => { const q = a['去掉'] || [0, 0]; return '<small style="color:var(--sub)">' + (q[1] ? 'AA ' + q[1] + '人' : '') + (q[1] && q[0] ? '<br>' : '') + (q[0] ? '副本 ' + q[0] : '') + (q[0] || q[1] ? '' : '—') + '</small>'; }) : '') +
        rw('最大一组', a => a['最大'] + '人') +
        (c ? rw('同时最多', a => { const pc = a['峰人'] / Math.max(c[1], 1); return '<span style="font-weight:700;color:' + (pc >= 0.8 ? 'var(--warn)' : 'var(--ink)') + '">' + a['峰人'] + '</span><br><small style="color:var(--sub)">' + Math.round(pc * 100) + '%</small>'; }) : '') +
        st[k].map((x, i) => '<tr class="pg' + (i ? '' : ' pg1') + '"><td class="lb"><span style="color:' + PCOL[x['平台']] + ';font-weight:700">' + x['平台'] + '</span> ' + (x['无料'] ? '<small style="color:var(--faint)">无料 </small>' : '') + (x['灰'] ? '<small style="color:var(--faint)" title="' + esc(RGT[x['灰']] || x['灰']) + '">' + esc(x['灰']) + ' </small>' : '') + esc(brandShort(String(x['品牌']).replace('（无料页）', '')) || x['品牌']) + '</td>' + dl.map(d => '<td>' + mk(x, d) + '</td>').join('') + '</tr>').join('') +
        '</table></div></div>';
    }).join('') + '</div>';
  if ((Y['读不到'] || []).length) h += '<p class="note">这次没读到的页面：' + Y['读不到'].map(esc).join('；') + '</p>';
  return h + '<p class="note">每天 5:00・11:00・13:00・15:30・22:00 自动查（17 点以后查的那次不判断今天）：先从 RB（预约系统）读今天起 7 天的预约，再查 T・H・G・R 每个网页的空席日历（只读公开网页、不登录；G・R 的网址是 11/17 用户给的表）。满不满用「座位表格」（真实桌数・最多人数）和 RB 每组的时段，算同一时间最多坐几人・几组。G 那边的日历不是实时的（ぐるなび 每隔几小时算一次）。R 的「×」是 Retty 自己预约页上按 2 人查的结果。</p></div>';
}

// ================= 🧹 卫生检查 =================
function renderHy() {
  if (!HR) return hrErr ? '<div class="err">' + esc(hrErr) + '</div>' : '<div class="empty">读取中…</div>';
  const all = hrParse().hy.filter(c => c['店'] !== '三幸園' && c['店'] !== '品川1');
  if (!all.length) return '<div class="empty">还没有卫生检查数据</div>';
  const by = {}; all.forEach(c => (by[c['店']] = by[c['店']] || []).push(c));
  Object.values(by).forEach(l => l.sort((a, b) => a['日期'].localeCompare(b['日期'])));
  const latest = Object.values(by).map(l => l[l.length - 1]).sort((a, b) => a['合计'] - b['合计']);
  const avg = Math.round(latest.reduce((s, c) => s + c['合计'], 0) / latest.length);
  const sev = latest.filter(c => (c['严重'] || []).length);
  const food = latest.filter(c => (c['严重'] || []).some(i => /过期|变质|食材确认|食品包装/.test(i['项'])));
  let h = '<div class="sec"><div class="grid g3"><div class="card kpi"><small>各店最近一次 平均</small><b>' + avg + '</b><span class="u">／200</span><div class="d">' + latest.length + ' 家・前厅＋后厨各 100</div></div>' +
    '<div class="card kpi"><small>有严重扣分（15 分以上）</small><b class="' + (sev.length ? 'dn' : '') + '">' + sev.length + '</b><span class="u">家</span><div class="d">食品相关 ' + food.length + ' 家</div></div>' +
    '<div class="card kpi"><small>没过 150 分</small><b class="' + (latest.filter(c => c['合计'] < 150).length ? 'dn' : '') + '">' + latest.filter(c => c['合计'] < 150).length + '</b><span class="u">家</span><div class="d">要复查</div></div></div>' +
    '<p class="note">「店长/负责人」「责任人」两栏表里还没填，填了这里会显示。检查人：人事李・人事曾・林社长。</p></div>';
  h += '<div class="sec"><h2>各店（分数低的在上）<small>点店看扣分和整改</small></h2><div class="card rows">' + latest.map(c => {
    const l = by[c['店']], p = l.length > 1 ? l[l.length - 2] : null, open = hyOpen.has(c['店']);
    const d = p ? c['合计'] - p['合计'] : null;
    const col = c['合计'] >= 180 ? 'var(--good)' : c['合计'] >= 150 ? 'var(--warn)' : 'var(--bad)';
    let x = '<div class="r' + (open ? ' open' : '') + '" onclick="tgHy(\'' + esc(c['店']) + '\')"><div class="nm">' + esc(c['店']) + '<small>' + (c['日期是推的'] ? +c['日期'].slice(5, 7) + '月' : c['日期'].slice(5).replace('-', '/')) + ' 检查' + (c['负责人'] ? '・' + esc(c['负责人']) : '') + '</small></div>' +
      '<div class="big" style="color:' + col + '">' + c['合计'] + '</div><div class="meta"><span>前厅 <b>' + c['前厅'] + '</b></span><span>后厨 <b>' + c['后厨'] + '</b></span><span>扣分 ' + c['扣分项'] + ' 项</span>' +
      (d != null ? '<span>比上次（' + p['日期'].slice(5).replace('-', '/') + ' ' + p['合计'] + '）<b class="' + (d >= 0 ? 'up' : 'dn') + '">' + (d >= 0 ? '▲' : '▼') + Math.abs(d) + '</b></span>' : '') +
      ((c['严重'] || []).length ? '<span class="dn">严重：' + c['严重'].map(i => esc(i['项'])).join('、') + '</span>' : '') + '</div>';
    if (open) {
      x += '<div class="det" onclick="event.stopPropagation()"><div class="card">' + ((c['问题'] || []).map(i => '<div class="issue"><span class="pill ' + (i['扣'] >= 15 ? 'p-bad' : i['扣'] >= 3 ? 'p-warn' : 'p-soft') + '">−' + i['扣'] + '</span><span>' + esc(i['区']) + '・' + esc(i['项']) + '</span>' + (i['整改'] ? '<span class="x">' + esc(i['整改']) + '</span>' : '') + '</div>').join('') || '<div class="empty">没有扣分</div>') +
        '</div>' + (l.length > 1 ? '<p class="note">历次：' + l.map(z => z['日期'].slice(5).replace('-', '/') + ' ' + z['合计']).join(' → ') + '</p>' : '') + '<p class="note">检查人：' + esc(c['检查人']) + '　表：' + esc(c['表']) + '</p></div>';
    }
    return x + '</div>';
  }).join('') + '</div></div>';
  return h;
}
function tgHy(k) { hyOpen.has(k) ? hyOpen.delete(k) : hyOpen.add(k); render(); }

// 独立 APP：显示图标、注册 sw.js（加到主屏幕用）、打开或切回来时看 sw.js 版本号，变了就重新载入一次
if (IN_KZ) $('back').style.display = ''; else $('logo').style.display = '';
if (!IN_KZ && !LOCAL && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
async function checkUpdate() {
  if (IN_KZ || LOCAL) return;
  try {
    const t = await (await fetch('sw.js?t=' + Date.now(), { cache: 'no-store' })).text();
    const v = (t.match(/const V = '([^']+)'/) || [])[1];
    if (v && v !== APPV && LS.get('reloadedFor', '') !== v) { LS.set('reloadedFor', v); location.reload(); }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkUpdate(); if (K) load(); } });
setInterval(() => { if (!document.hidden && K && tab === 'qr') loadQr(); }, 120000);   // 11/18 谷歌扫码页开着时每 2 分钟读一次
checkUpdate();
load();
</script>
